<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8 位代表案例 · 健康管理工作台</title>
<style>
:root{--brand:#006F8A;--brand2:#009BBF;--bg:#EFF3F5;--line:#E5EBED;--ink:#1A1A1A;--ink2:#3D474B;--muted:#879397}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 "PingFang SC","Microsoft YaHei",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 26px;position:sticky;top:0;z-index:30}
.topbar h1{font-size:18px;color:var(--brand);margin:0;white-space:nowrap}
.topbar .sub{font-size:13px;color:var(--muted);white-space:nowrap}
.topbar .spacer{flex:1}
.topbar a{color:var(--brand);font-size:13px;text-decoration:none;white-space:nowrap}
.topbar a:hover{text-decoration:underline}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;max-width:1560px;margin:0 auto;padding:18px 24px 44px;align-items:start}
.side{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow-y:auto;padding-right:2px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,111,138,.04)}
.panel h3{font-size:14px;color:var(--brand);margin:0 0 8px}
.case-list{display:flex;flex-direction:column;gap:4px}
.case-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:#F8FAFB;border-radius:8px;padding:6px 9px;cursor:pointer;font:inherit;font-size:13.5px;color:var(--ink2)}
.case-item:hover{border-color:var(--brand2);background:#F1FAFC}
.case-item.on{background:#EAF6F8;border-color:var(--brand2);color:var(--brand);font-weight:600}
.case-item .dim{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:400;white-space:nowrap}
.profile-name{font-size:22px;color:var(--brand);font-weight:600;line-height:1.4}
.profile-dim{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;background:#EAF6F8;color:var(--brand);margin:4px 0 9px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}
.metric{background:#F6FAFB;border-radius:8px;padding:6px 4px;text-align:center}
.metric b{display:block;font-size:17px;color:var(--brand)}
.metric span{font-size:11px;color:var(--muted)}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 8px;font-size:12.5px;color:var(--ink2);margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.gap-list{font-size:12.5px;color:var(--muted);line-height:1.65}
.sec-t{font-size:13.5px;color:var(--brand);font-weight:600;margin:10px 0 4px}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;padding:10px 14px;border-radius:8px;font:inherit;font-size:14px;color:var(--ink2);cursor:pointer}
.tabs button:hover{background:#F1FAFC;color:var(--brand)}
.tabs button.on{background:var(--brand);color:#fff;font-weight:600}
.main-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.main-head h2{font-size:18px;color:var(--brand);margin:0}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;background:#EAF6F8;color:var(--brand)}
.card,.screen{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 22px;box-shadow:0 2px 8px rgba(0,111,138,.04)}
.card h3,.screen h2{font-size:17px;color:var(--brand);margin:0 0 10px}
.screen.cover h2{font-size:24px;line-height:1.5;margin:4px 0 14px}
.card h3 i{font-style:normal;color:var(--brand2);font-size:13px;margin-right:8px}
.eyebrow{font-size:12px;color:var(--brand2);letter-spacing:1px;margin:0 0 6px}
.card__b p,.screen p,.card > p{margin:0 0 10px;font-size:14px;color:var(--ink2)}
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.mods .card,.two .card,.screens .screen{margin:0}
.screens .screen{align-self:start}
.wide{grid-column:1/-1}
.two,.screens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.grade__h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.grade__h b{color:var(--brand);font-size:15px}
.grade__bar{display:flex;gap:4px;margin:8px 0 6px}
.grade__bar i{flex:1;height:7px;border-radius:4px;background:#E8EEF0}
.grade__bar i.on{background:var(--brand2)}
.grade__ax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.grade__ax .on{color:var(--brand);font-weight:600}
.hint{display:block;margin-top:12px;padding:10px 12px;background:#F3FAFB;border-left:3px solid var(--brand2);border-radius:0 8px 8px 0;font-size:14px;color:var(--ink2)}
.ul{margin:8px 0;padding-left:18px}
.ul li{margin-bottom:6px;font-size:14px;color:var(--ink2)}
.ul b{color:var(--ink)}
.note{font-size:12.5px !important;color:var(--muted) !important}
.mbar{display:flex;align-items:center;gap:8px;background:#F3FAFB;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.mbar b{color:var(--brand)}
.mbar i{height:6px;background:var(--brand2);border-radius:4px;display:block;min-width:8px}
.tb{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.tb th,.tb td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.tb th{background:#F6FAFB;color:var(--ink2);font-weight:600}
.disc{font-size:12.5px;color:var(--muted);padding:8px 2px;line-height:1.7}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 0}
.kpi{background:#F6FAFB;border-radius:8px;padding:8px 6px;text-align:center}
.kpi b{display:block;font-size:18px;color:var(--brand)}
.kpi span{font-size:11.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;background:#FBFCFD;border-radius:8px;margin:8px 0}
.band{height:78px;border-radius:10px;background:linear-gradient(135deg,#D9EEF3,#EAF6F8 60%,#F7FBFB);margin:10px 0;display:flex;align-items:center;justify-content:center;color:var(--brand);font-size:14px;letter-spacing:1px}
.persona{background:#F3FAFB;border-radius:10px;padding:14px;text-align:center}
.persona b{display:block;font-size:19px;color:var(--brand);line-height:1.5}
.persona p{font-size:13px;color:var(--ink2);margin:8px 0 0}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.stat{flex:1;min-width:110px;background:#F6FAFB;border-radius:8px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--brand)}
.stat span{font-size:12px;color:var(--muted)}
.insufficient{background:#FFF8EC;border:1px solid #F3DFC0;color:#8A6420;border-radius:10px;padding:16px;font-size:14px}
@media (max-width:1000px){.app{grid-template-columns:1fr}.side{position:static;max-height:none}.mods,.two,.screens{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
</head>

var CASES = [{"id":"C1","name":"沈知远","dim":"有化验异常","gender":"男","age":27.8,"category":"科学减重","drug":"替尔泊肽","dose":"2.5mg/次","height":175,"weight":74.7,"bmi":24.4,"bmiLabel":"超重","waist":92.2,"weightAt":"2026-11-04 16:14","latestVisit":"2026-11-04 16:14","visitCount":8,"labAbn":8,"examAbn":3,"seCount":1,"rebound":0,"weightAge":6.977692881944445,"missing":["无陪跑反馈","问卷禁忌症 / 孕产状态未确认"],"chronic":[],"orderCount":1,"a":{"tier":"normal","tierLabel":"需要减重管理","cur":2,"hint":"当前 BMI 24.4，并伴有化验异常，建议饮食、运动与医生评估同步开展。","mods":[{"t":"整体建议","html":"\u003cp>最近一次实测 74.7kg（11月4日），BMI 24.4（超重），化验异常 8 项，检查异常 3 项，不良反应 1 条。这些记录来自已关联的体测、化验、检查与就诊资料，问卷未覆盖的部分由医生面诊时补充。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>当下最需要解决的\u003c/b>：先把体检里出现的异常指标与减重安排放到一起看，避免只盯体重\u003c/li>\u003cli>\u003cb>现有记录里的线索\u003c/b>：肝功异常 1 项；检查异常 3 项（含需重点核对发现）\u003c/li>\u003c/ul>"},{"t":"饮食建议","html":"\u003cp>已有化验指标异常，饮食调整的重点是让每餐结构稳定，而不是额外压低饭量。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>每餐怎么安排\u003c/b>：按一掌蛋白、一拳主食、一捧蔬菜起步，先固定三餐时段\u003c/li>\u003cli>\u003cb>用药后胃口变小\u003c/b>：把一顿拆成两三次，清淡少量，恶心明显时先放一放\u003c/li>\u003cli>\u003cb>记录做到什么程度\u003c/b>：体重每周记 1 次、腰围每月记 1 次即可，外食与甜饮打勾\u003c/li>\u003c/ul>\u003cp class=\"note\">营养师会按复查记录给出个性化方案。\u003c/p>"},{"t":"运动建议","html":"\u003cp>运动先从维持原有走动开始，等身体适应后再考虑增加次数，避免在用药早期同时改动太多安排。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>起步量\u003c/b>：在现状上每天多走 1000 步，久坐时起身走动\u003c/li>\u003cli>\u003cb>力量与有氧\u003c/b>：适应后抗阻每周 2 次、每次 10–15 分钟，有氧每周 3 次、每次 10–20 分钟\u003c/li>\u003cli>\u003cb>需要停下的时候\u003c/b>：胸痛、明显气促、头晕或关节剧痛时立即停止并联系医生\u003c/li>\u003c/ul>"},{"t":"用药建议","html":"\u003cdiv class=\"mbar\">\u003cspan>匹配度\u003c/span>\u003cb>较高\u003c/b>\u003ci style=\"width:78%\">\u003c/i>\u003c/div>\u003cp>结合你的体重与体检记录，建议在调整饮食和运动的同时配合药物：它通过延缓胃排空、降低食欲减少摄入，让控制饮食的过程少一些饥饿感。\u003c/p>\u003cp>根据你当前的体重情况，参考按临床数据，用药后的体重预计变化情况如下：\u003c/p>\u003ctable class=\"tb\">\u003cthead>\u003ctr>\u003cth>周期\u003c/th>\u003cth>平均减重\u003c/th>\u003cth>你的参考值\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1 个月\u003c/td>\u003ctd>3%–4%\ span>\u003cb>较高\u003c/b>\u003ci style=\"width:78%\">\u003c/i>\u003c/div>\u003cp>结合你的体重与体检记录，建议在调整饮食和运动的同时配合药物：它通过延缓胃排空、降低食欲减少摄入，让控制饮食的过程少一些饥饿感。\u003c/p>\u003cp>根据你当前的体重情况，参考按临床数据，用药后的体重预计变化情况如下：\u003c/p>\u003ctable class=\"tb\">\u003cthead>\u003ctr>\u003cth>周期\u003c/th>\u003cth>平均减重\u003c/th>\u003cth>你的参考值\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1 个月\u003c/td>\u003ctd>3%–4%\u003c/td>\u003ctd>−4~5 斤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 个月\u003c/td>\u003ctd>8%–10%\u003c/td>\u003ctd>−10~13 斤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6 个月\u003c/td>\u003ctd>12%–15%\u003c/td>\u003ctd>−15~19 斤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12 个月\u003c/td>\u003ctd>18%–21%\u003c/td>\u003ctd>−23~26 斤\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>用药前你可能想确认的：\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>用药能多减多少\u003c/b>：单靠生活方式一年通常减掉体重的 3%–5%，配合药物后的幅度见上表\u003c/li>\u003cli>\u003cb>用药安全吗\u003c/b>：已在国内外获批用于体重管理，医生评估通过后从小剂量开始，用药期间按随访计划监测\u003c/li>\u003cli>\u003cb>是否会依赖\u003c/b>：这类药物不是成瘾性药物，停药后由生活习惯接管维持\u003c/li>\u003cli>\u003cb>是否需要长期使用\u003c/b>：达到目标后按复查结果逐步减量，多数人不需要一直使用\u003c/li>\u003cli>\u003cb>胃肠道反应\u003c/b>：多在前 4 周逐渐适应，不适明显时随时联系医生调整\u003c/li>\u003c/ul>\u003cp>用药期间需留意已有异常指标的波动，复查时把前后两次记录放在一起看。\u003c/p>\u003cp class=\"note\">上述区间来自临床研究，个体差异较大，以实际随访数据为准。\u003c/p>"},{"t":"就诊建议","html":"\u003cp>检查发现需要医生核对，面诊时把影像与检查报告一并带上。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>面诊看什么\u003c/b>：由医生结合原始记录判断体重管理方式与用药适用性\u003c/li>\u003cli>\u003cb>复查怎么安排\u003c/b>：按医生给出的复查计划回看指标变化\u003c/li>\u003c/ul>"}],"disc":"本页内容基于你填写的问卷与已关联的健康数据生成，为初步评估建议，不构成诊断和处方。"},"m":{"status":"ok","no":1,"month":11,"nextMonth":12,"tag":"遇到平台","title":"第一个月：先把节奏稳住","range":"7月23日 – 11月6日","span":"按现有 5 次体测记录 · 示例期","weeks":[62.9,63,62.9,63,63],"weekLabels":["开始","08/21","09/09","09/29","11/06"],"end":63,"delta":0.1,"total":0.1,"bmi":23.7,"waist":89.5,"analysis":"截至 11月，已关联的 5 次体测记录从 62.9kg 到 63.0kg，变化 +0.1kg，体重几乎没动。检查发现需要医生核对，这一期没有记录到需要改动的饮食或运动安排，这一期没有找到需要改动的地方，先照现在的用药继续观察。\n12月把影像与检查报告带到面诊，由医生判断减重节奏；用药剂量与进阶 1,"labAbn":0,"examAbn":1,"seCount":0,"rebound":0,"weightAge":3.067276215277778,"missing":["无化验结果","无腰围记录","体重记录不足 2 次，无法判断轨迹","无结构化血压记录","无陪跑反馈","问卷禁忌症 / 孕产状态未确认"],"chronic":[],"orderCount":1,"a":{"tier":"normal","tierLabel":"需要减重管理","cur":2,"hint":"当前 BMI 32.2，并伴有检查异常，建议饮食、运动与医生评估同步开展。","mods":[{"t":"整体建议","html":"\u003cp>最近一次实测 86.3kg（11月8日），BMI 32.2（肥胖），检查异常 1 项。这些记录来自已关联的体测、化验、检查与就诊资料，问卷未覆盖的部分由医生面诊时补充。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>当下最需要解决的\u003c/b>：就诊与化验记录较少，先补齐基础信息再判断下一步\u003c/li>\u003cli>\u003cb>现有记录里的线索\u003c/b>：检查异常 1 项；BMI 32.2，达到肥胖范围\u003c/li>\u003c/ul>"},{"t":"饮食建议","html":"\u003cp>体重管理期间，饮食的作用是把摄入稳定在可长期维持的水平，不需要一次性改掉所有习惯。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>每餐怎么安排\u003c/b>：按一掌蛋白、一拳主食、一捧蔬菜起步，先固定三餐时段\u003c/li>\u003cli>\u003cb>用药后胃口变小\u003c/b>：把一顿拆成两三次，清淡少量，恶心明显时先放一放\u003c/li>\u003cli>\u003cb>记录做到什么程度\u003c/b>：体重每周记 1 次、腰围每月记 1 次即可，外食与甜饮打勾\u003c/li>\u003c/ul>\u003cp class=\"note\">营养师会按复查记录给出个性化方案。\u003c/p>"},{"t":"运动建议","html":"\u003cp>运动先从维持原有走动开始，等身体适应后再考虑增加次数，避免在用药早期同时改动太多安排。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>起步量\u003c/b>：在现状上每天多走 1000 步，久坐时起身走动\u003c/li>\u003cli>\u003cb>力量与有氧\u003c/b>：适应后抗阻每周 2 次、每次 10–15 分钟，有氧每周 3 次、每次 10–20 分钟\u003c/li>\u003cli>\u003cb>需要停下的时候\u003c/b>：胸痛、明显气促、头晕或关节剧痛时立即停止并联系医生\u003c/li>\u003c/ul>"},{"t":"用药建议","html":"\u003cdiv class=\"mbar\">\u003cspan>匹配度\u003c/span>\u003cb>较高\u003c/b>\u003ci style=\"width:78%\">\u003c/i>\u003c/div>\u003cp>结合你的体重与体检记录，建议在调整饮食和运动的同时配合药物：它通过延缓胃排空、降低食欲减少摄入，让控制饮食的过程少一些饥饿感。\u003c/p>\u003cp>根据你当前的体重情况，参考按临床数据，用药后的体重预计变化情况如下：\u003c/p>\u003ctable class=\"tb\">\u003cthead>\u003ctr>\u003cth>周期\u003c/th>\u003cth>平均减重\u003c/th>\u003cth>你的参考值\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1 个月\u003c/td>\u003ctd>3%–4%\u003c/td>\u003ctd>−5~7 斤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 个月\u003c/td>\u003ctd>8%–10%\u003c/td>\u003ctd>−14~17 斤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6 个月\u003c/td>\u003ctd>12%–15%\u003c/td>\u003ctd>−21~26 斤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12 个月\u003c/td>\u003ctd>18%–21%\u003c/td>\u003ctd>−31~36 斤\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>用药前你可能想确认的：\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>用药能多减多少\u003c/b>：单靠生活方式一年通常减掉体重的 3%–5%，配合药物后的幅度见上表\u003c/li>\u003cli>\u003cb>用药安全吗\u003c/b>：已在国内外获批用于体重管理，医生评估通过后从小剂量开始，用药期间按随访计划监测\u003c/li>\u003cli>\u003cb>是否会依赖\u003c/b>：这类药物不是成瘾性药物，停药后由生活习惯接管维持\u003c/li>\u003cli>\u003cb>是否需要长期使用\u003c/b>：达到目标后按复查结果逐步减量，多数人不需要一直使用\u003c/li>\u003cli>\u003cb>胃肠道反应\u003c/b>：多在前 4 周逐渐适应，不适明显时随时联系医生调整\u003c/li>\u003c/ul>\u003cp class=\"note\">上述区间来自临床研究，个体差异较大，以实际随访数据为准。\u003c/p>"},{"t":"就诊建议","html":"\u003cp>现有就诊与化验记录较少，面诊时请补充近期检查结果与用药情况。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>面诊看什么\u003c/b>：由医生结合原始记录判断体重管理方式与用药适用性\u003c/li>\u003cli>\u003cb>复查怎么安排\u003c/b>：按医生给出的复查计划回看指标变化\u003c/li>\u003c/ul>"}],"disc":"本页内容基于你填写的问卷与已关联的健康数据生成，为初步评估建议，不构成诊断和处方。"},"m":{"status":"insufficient","reason":"该案例的体测记录不足 2 次，无法组成一期示例月报","points":1,"svg":""},"r":{"status":"insufficient","reason":"该案例的体测记录不足 2 次，按数据不足处理，不生成结营回顾","svg":""}}];

var esc=function(v){var s=String(v==null?"":v);return s.split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;").split('"').join("&quot;").split("'").join("&#39;");};
var fmt=function(t){var s=String(t||"");return s?Number(s.slice(5,7))+"月"+Number(s.slice(8,10))+"日":"—";};
var TABS=[["assessment","评估报告"],["monthly","月报示例"],["recap","减重回顾页"]];
var q=new URLSearchParams(location.search);
var state={id:q.get("id")||CASES[0].id,tab:q.get("tab")||"assessment"};
if(!CASES.some(function(c){return c.id===state.id;}))state.id=CASES[0].id;
if(!TABS.some(function(t){return t[0]===state.tab;}))state.tab="assessment";
function curCase(){return CASES.filter(function(c){return c.id===state.id;})[0]||CASES[0];}
function setUrl(){try{var u=new URL(location.href);u.searchParams.set("id",state.id);u.searchParams.set("tab",state.tab);history.replaceState(null,"",u.toString());}catch(e){}}
function renderSide(){
  var c=curCase();
  document.getElementById("caseList").innerHTML=CASES.map(function(x){
    return '<button type="button" class="case-item'+(x.id===state.id?" on":"")+'" data-id="'+x.id+'"><span>'+x.id+" "+esc(x.name)+'</span><span class="dim">'+esc(x.dim)+"</span></button>";
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("#caseList button"),function(b){b.addEventListener("click",function(){setCase(this.dataset.id);});});
  var rows=[
    ["性别 / 年龄",esc(c.gender)+" · "+esc(c.age)+" 岁"],
    ["服务类别",esc(c.category)],
    ["订阅用药",esc(c.drug)+(c.dose?" "+esc(c.dose):"")],
    ["身高",c.height?esc(c.height)+"cm":"—"],
    ["腰围",c.waist!==null?esc(c.waist)+"cm":"无记录"],
    ["最近体测",c.weightAt?fmt(c.weightAt):"—"],
    ["体重距今天数",c.weightAge!==null&&c.weightAge!==undefined?Math.round(c.weightAge)+" 天":"—"],
    ["最近就诊",c.latestVisit?fmt(c.latestVisit):"—"],
    ["化验 / 检查异常",c.labAbn+" 项 / "+c.examAbn+" 项"],
    ["不良反应",c.seCount+" 条"],
    ["长期用药",c.chronic.length?esc(c.chronic.join("；")):"无记录"],
    ["订阅订单",c.orderCount+" 笔"]
  ];
  document.getElementById("profile").innerHTML=
    '<div class="profile-name">'+esc(c.id)+" "+esc(c.name)+'</div><div class="profile-dim">'+esc(c.dim)+"</div>"+
    '<div class="metrics"><div class="metric"><b>'+(c.weight!==null?c.weight:"—")+'</b><span>体重 kg</span></div>'+
    '<div class="metric"><b>'+(c.bmi!==null?c.bmi:"—")+'</b><span>BMI</span></div>'+
    '<div class="metric"><b>'+c.visitCount+'</b><span>就诊次数</span></div></div>'+
    '<dl class="kv">'+rows.map(function(r){return "<dt>"+r[0]+"</dt><dd>"+r[1]+"</dd>";}).join("")+"</dl>"+
    '<div class="sec-t">BMI 分档 / 数据缺口</div><div class="gap-list">'+esc(c.bmiLabel||"无体测数据")+(c.missing.length?"；"+esc(c.missing.slice(0,3).join("；")):"")+"</div>";
}
function renderTabs(){
  document.getElementById("tabs").innerHTML=TABS.map(function(t){
    return '<button type="button" data-tab="'+t[0]+'" class="'+(state.tab===t[0]?"on":"")+'">'+t[1]+"</button>";
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){b.addEventListener("click",function(){setTab(this.dataset.tab);});});
}
function insufficient(c,reason,what){
  return '<div class="insufficient"><b>'+esc(c.name)+'</b> · '+esc(c.dim)+'<br>'+esc(reason)+'，按数据不足处理，不生成'+what+'。</div><div class="disc">缺数据的屏整屏不展示，不写占位、不补数字。</div>';
}
function RENDER_ASSESS(c){
  var a=c.a,h="",bars="",ax="";
  for(var i=0;i<3;i++){bars+='<i class="'+(i===a.cur-1?"on":"")+'"></i>';ax+='<span class="'+(i===a.cur-1?"on":"")+'">'+["无需减重","需要减重管理","需要减重与慢病结合管理"][i]+"</span>";}
  h+='<section class="card wide" style="margin-bottom:14px"><div class="grade"><div class="grade__h"><span>减重建议</span><b>'+esc(a.tierLabel)+'</b></div><div class="grade__bar">'+bars+'</div><div class="grade__ax">'+ax+'</div></div><span class="hint">'+esc(a.hint)+"</span></section>";
  h+='<div class="mods">';
  a.mods.forEach(function(m,i){
    var wide=(m.t==="整体建议"||m.t==="用药建议"||m.t==="就诊建议")?" wide":"";
    h+='<section class="card'+wide+'"><h3><i>'+("0"+(i+1)).slice(-2)+"</i>"+esc(m.t)+'</h3><div class="card__b">'+m.html+"</div></section>";
  });
  h+="</div>";
  h+='<div class="disc">'+esc(a.disc)+"</div>";
  return h;
}
function RENDER_MONTHLY(c){
  var m=c.m;
  if(m.status!=="ok")return insufficient(c,m.reason,"示例月报");
  var h='<div class="note" style="margin-bottom:10px">示例期按现有真实体测记录整理，非连续周打卡；不构成医嘱。</div>';
  h+='<section class="card" style="margin-bottom:14px"><div class="eyebrow">体重管理 · 第 1 期示例月报 · '+esc(c.name)+'</div><h2>'+esc(m.title)+'</h2><p class="note">'+esc(m.range)+" · "+esc(m.span)+'</p><span class="tag">'+esc(m.tag)+"</span>";
  h+='<div class="kpis"><div class="kpi"><b>'+(m.delta>0?"+":"")+m.delta+'</b><span>'+m.month+'月变化 kg</span></div><div class="kpi"><b>'+m.total+'</b><span>累计变化 kg</span></div><div class="kpi"><b>'+m.bmi+'</b><span>BMI</span></div><div class="kpi"><b>'+(m.waist!==null?m.waist:"—")+'</b><span>腰围 cm</span></div></div></section>';
  h+='<div class="two"><section class="card"><h3><i>01</i>减重数据分析</h3>'+m.analysis.split(String.fromCharCode(10)).map(function(t){return "<p>"+esc(t)+"</p>";}).join("")+"</section>";
  h+='<section class="card"><h3><i>02</i>'+m.nextMonth+'月的饮食与运动</h3><div class="sec-t">饮食</div><ul class="ul">'+m.diet.map(function(t){return "<li>"+esc(t)+"</li>";}).join("")+'</ul><div class="sec-t">运动</div><ul class="ul">'+m.sport.map(function(t){return "<li>"+esc(t)+"</li>";}).join("")+"</ul></section></div>";
  h+='<section class="card" style="margin-bottom:14px"><h3>体重记录</h3>'+m.svg+"</section>";
  h+='<div class="disc">'+esc(m.note)+" 期头、概览与审核信息由页面模板生成。</div>";
  return h;
}
function RENDER_RECAP(c){
  var r=c.r;
  if(r.status!=="ok")return insufficient(c,r.reason,"结营回顾");
  var h='<div class="note" style="margin-bottom:10px">体重描点来自该案例真实体测记录，周数按记录点数折算，非连续周打卡；缺数据的屏整屏不展示。</div><div class="screens">';
  h+='<section class="screen cover wide" style="text-align:center"><div class="eyebrow">结营回顾 · '+esc(c.name)+'</div><h2>这是一个，<br />成为更好的自己的故事。</h2><div class="band">'+esc(r.coverLead)+'</div><p class="note">本页为健康管理服务记录，不构成诊疗建议</p></section>';
  h+='<section class="screen"><div class="eyebrow">01 / 第一次看见变化</div><h2>'+esc(r.s1.h2)+'</h2><div class="stat-row"><div class="stat"><b>'+esc(r.s1.big)+' <i style="font-style:normal;font-size:13px">kg</i></b><span>'+esc(r.s1.kicker)+"</span></div></div><p>"+esc(r.s1.body)+"</p></section>";
  h+='<section class="screen"><div class="eyebrow">02 / '+esc(r.s2.eyebrow)+'</div><h2>'+esc(r.s2.h2)+"</h2>"+r.svg+"<p>"+esc(r.s2.body)+"</p></section>";
  if(r.s3.show){h+='<section class="screen"><div class="eyebrow">03 / 身体更轻盈</div><h2>欣喜的发现，裤子悄悄变大了。</h2><div class="stat-row">'+r.s3.grid.map(function(g){return '<div class="stat"><b>'+esc(g.v)+' <i style="font-style:normal;font-size:13px">'+esc(g.u)+'</i></b><span>'+esc(g.k)+"</span></div>";}).join("")+"</div><p>"+esc(r.s3.body)+"</p></section>";}
  if(r.s5.show){h+='<section class="screen"><div class="eyebrow">05 / 专业支持的陪伴</div><h2>这段旅程，卓正为你保驾护航</h2><p>卓正医疗以专业和关怀，一路陪伴你的减重之旅。</p>'+(r.s5.body_after?"<p>"+esc(r.s5.body_after)+"</p>":"")+'<div class="stat-row">'+r.s5.stats.map(function(s){return '<div class="stat"><b>'+esc(s.v)+' <i style="font-style:normal;font-size:13px">'+esc(s.u)+'</i></b><span>'+esc(s.k)+"</span></div>";}).join("")+"</div></section>";}
  h+='<section class="screen wide"><div class="eyebrow">06 / 你的减重人格是</div><div class="persona"><b>'+esc(r.persona.name[0])+"<br />"+esc(r.persona.name[1])+'。</b><p>'+esc(r.persona.desc)+'</p></div><p class="note" style="text-align:center;margin-top:10px">时间会奖励努力的人。</p></section>';
  h+='<section class="screen wide"><div class="eyebrow">07 / 让健康成为常态</div><h2>健康，是一种长期主义。</h2><p>继续关注身体的变化，保持适合自己的节奏，让健康管理融入更长久的生活。</p><p>卓正与你一路同行，为你提供全家人的健康管理支持。</p><p><b>'+esc(r.s7.strong)+"</b></p></section>";
  h+="</div>";
  h+='<div class="disc">'+esc(r.note)+"</div>";
  return h;
}
function renderMain(){
  var c=curCase(),fn=state.tab==="monthly"?RENDER_MONTHLY:state.tab==="recap"?RENDER_RECAP:RENDER_ASSESS;
  document.getElementById("view").innerHTML=fn(c);
  var t=TABS.filter(function(x){return x[0]===state.tab;})[0];
  document.getElementById("viewTitle").textContent=c.name+" · "+t[1];
  document.getElementById("viewTag").textContent=c.dim;
}
function render(){renderSide();renderTabs();renderMain();setUrl();document.title=curCase().name+" · 代表案例工作台";}
function setCase(id){state.id=id;render();}
function setTab(tab){state.tab=tab;render();}
render();

</script>
</body>
