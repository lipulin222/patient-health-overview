<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8 位代表案例 · 健康管理工作台</title>
<style>
:root{--brand:#006F8A;--brand2:#009BBF;--bg:#EFF3F5;--line:#E5EBED;--ink:#1A1A1A;--ink2:#3D474B;--muted:#879397}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 "PingFang SC","Microsoft YaHei",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 26px;position:sticky;top:0;z-index:30}
.topbar h1{font-size:18px;color:var(--brand);margin:0;white-space:nowrap}
.topbar .sub{font-size:13px;color:var(--muted);white-space:nowrap}
.topbar .spacer{flex:1}
.topbar a{color:var(--brand);font-size:13px;text-decoration:none;white-space:nowrap}
.topbar a:hover{text-decoration:underline}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;max-width:1560px;margin:0 auto;padding:18px 24px 44px;align-items:start}
.side{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow-y:auto;padding-right:2px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,111,138,.04)}
.panel h3{font-size:14px;color:var(--brand);margin:0 0 8px}
.case-list{display:flex;flex-direction:column;gap:4px}
.case-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:#F8FAFB;border-radius:8px;padding:6px 9px;cursor:pointer;font:inherit;font-size:13.5px;color:var(--ink2)}
.case-item:hover{border-color:var(--brand2);background:#F1FAFC}
.case-item.on{background:#EAF6F8;border-color:var(--brand2);color:var(--brand);font-weight:600}
.case-item .dim{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:400;white-space:nowrap}
.profile-name{font-size:22px;color:var(--brand);font-weight:600;line-height:1.4}
.profile-dim{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;background:#EAF6F8;color:var(--brand);margin:4px 0 9px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}
.metric{background:#F6FAFB;border-radius:8px;padding:6px 4px;text-align:center}
.metric b{display:block;font-size:17px;color:var(--brand)}
.metric span{font-size:11px;color:var(--muted)}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 8px;font-size:12.5px;color:var(--ink2);margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.gap-list{font-size:12.5px;color:var(--muted);line-height:1.65}
.sec-t{font-size:13.5px;color:var(--brand);font-weight:600;margin:10px 0 4px}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;padding:10px 14px;border-radius:8px;font:inherit;font-size:14px;color:var(--ink2);cursor:pointer}
.tabs button:hover{background:#F1FAFC;color:var(--brand)}
.tabs button.on{background:var(--brand);color:#fff;font-weight:600}
.main-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.main-head h2{font-size:18px;color:var(--brand);margin:0}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;background:#EAF6F8;color:var(--brand)}
.card,.screen{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 22px;box-shadow:0 2px 8px rgba(0,111,138,.04)}
.card h3,.screen h2{font-size:17px;color:var(--brand);margin:0 0 10px}
.card h3 i{font-style:normal;color:var(--brand2);font-size:13px;margin-right:8px}
.screen.cover h2{font-size:24px;line-height:1.5;margin:4px 0 14px}
.eyebrow{font-size:12px;color:var(--brand2);letter-spacing:1px;margin:0 0 6px}
.card__b p,.screen p,.card > p{margin:0 0 10px;font-size:14px;color:var(--ink2)}
.profile-line{background:#F3FAFB;border-radius:8px;padding:10px 14px;font-size:14px;color:var(--brand);margin-bottom:12px}
.reading{margin:10px 0 0;font-size:14px;color:var(--ink2)}
.hl{color:var(--brand2);font-weight:600}
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:12px 0}
.chain span{background:#F3FAFB;border:1px solid #DCEBF0;border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--ink2)}
.chain i{font-style:normal;color:var(--brand2)}
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.mods .card,.two .card,.screens .screen{margin:0}
.screens .screen{align-self:start}
.wide{grid-column:1/-1}
.two,.screens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.grade__h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.grade__h b{color:var(--brand);font-size:15px}
.grade__bar{display:flex;gap:4px;margin:8px 0 6px}
.grade__bar i{flex:1;height:7px;border-radius:4px;background:#E8EEF0}
.grade__bar i.on{background:var(--brand2)}
.grade__ax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.grade__ax .on{color:var(--brand);font-weight:600}
.ul{margin:8px 0;padding-left:18px}
.ul li{margin-bottom:6px;font-size:14px;color:var(--ink2)}
.ul b{color:var(--ink)}
.note{font-size:12.5px !important;color:var(--muted) !important}
.mbar{display:flex;align-items:center;gap:8px;background:#F3FAFB;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.mbar b{color:var(--brand)}
.mbar i{height:6px;background:var(--brand2);border-radius:4px;display:block;min-width:8px}
.tb{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.tb th,.tb td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.tb th{background:#F6FAFB;color:var(--ink2);font-weight:600}
.disc{font-size:12.5px;color:var(--muted);padding:8px 2px;line-height:1.7}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 0}
.kpi{background:#F6FAFB;border-radius:8px;padding:8px 6px;text-align:center}
.kpi b{display:block;font-size:18px;color:var(--brand)}
.kpi span{font-size:11.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;background:#FBFCFD;border-radius:8px;margin:8px 0}
.band{height:78px;border-radius:10px;background:linear-gradient(135deg,#D9EEF3,#EAF6F8 60%,#F7FBFB);margin:10px 0;display:flex;align-items:center;justify-content:center;color:var(--brand);font-size:14px;letter-spacing:1px}
.persona{background:#F3FAFB;border-radius:10px;padding:14px;text-align:center}
.persona b{display:block;font-size:19px;color:var(--brand);line-height:1.5}
.persona p{font-size:13px;color:var(--ink2);margin:8px 0 0}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.stat{flex:1;min-width:110px;background:#F6FAFB;border-radius:8px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--brand)}
.stat span{font-size:12px;color:var(--muted)}
.insufficient{background:#FFF8EC;border:1px solid #F3DFC0;color:#8A6420;border-radius:10px;padding:16px;font-size:14px}
.insufficient code{background:#fff;padding:1px 5px;border-radius:4px;font-size:12.5px}
.share-btn{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;padding:8px 16px;font:inherit;font-size:13px;cursor:pointer}
.share-btn:hover{background:#F1FAFC}
.sheet-mask{position:fixed;inset:0;background:rgba(20,35,40,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.sheet-mask[hidden]{display:none}
.sheet{background:#fff;border-radius:14px;padding:18px;width:min(420px,100%);max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:17px;color:var(--brand)}
.sheet p{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.sheet canvas{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:#F7FBFB}
.sheet label{display:block;margin:12px 0;font-size:13px;color:var(--ink2)}
.sheet-btns{display:flex;gap:10px;justify-content:flex-end}
.sheet-btns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.sheet-btns .primary{background:var(--brand);border-color:var(--brand);color:#fff}
@media (max-width:1000px){.app{grid-template-columns:1fr}.side{position:static;max-height:none}.mods,.two,.screens{grid-template-columns:1fr}.wide{grid-column:auto}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

var TABS=[["assessment","评估报告"],["monthly","月报示例"],["recap","减重回顾页"]];
var q=new URLSearchParams(location.search);
var state={id:q.get("id")||CASES[0].id,tab:q.get("tab")||"assessment"};
if(!CASES.some(function(c){return c.id===state.id;}))state.id=CASES[0].id;
if(!TABS.some(function(t){return t[0]===state.tab;}))state.tab="assessment";
function curCase(){return CASES.filter(function(c){return c.id===state.id;})[0]||CASES[0];}
function setUrl(){try{var u=new URL(location.href);u.searchParams.set("id",state.id);u.searchParams.set("tab",state.tab);history.replaceState(null,"",u.toString());}catch(e){}}
function renderSide(){
  var c=curCase();
  document.getElementById("caseList").innerHTML=CASES.map(function(x){
    return '<button type="button" class="case-item'+(x.id===state.id?" on":"")+'" data-id="'+x.id+'"><span>'+x.id+" "+esc(x.name)+'</span><span class="dim">'+esc(x.dim)+"</span></button>";
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("#caseList button"),function(b){b.addEventListener("click",function(){setCase(this.dataset.id);});});
  var rows=[
    ["性别 / 年龄",esc(c.gender)+" · "+esc(c.age)+" 岁"],
    ["服务类别",esc(c.category)],
    ["订阅用药",esc(c.drug)+(c.dose?" "+esc(c.dose):"")],
    ["身高",c.height?esc(c.height)+"cm":"—"],
    ["腰围",c.waist!==null?esc(c.waist)+"cm":"无记录"],
    ["最近体测",c.weightAt?fmt(c.weightAt):"—"],
    ["体重距今天数",c.weightAge!==null&&c.weightAge!==undefined?Math.round(c.weightAge)+" 天":"—"],
    ["最近就诊",c.latestVisit?fmt(c.latestVisit):"—"],
    ["化验 / 检查异常",c.labAbn+" 项 / "+c.examAbn+" 项"],
    ["不良反应",c.seCount+" 条"],
    ["长期用药",c.chronic.length?esc(c.chronic.join("；")):"无记录"],
    ["订阅订单",c.orderCount+" 笔"]
  ];
  document.getElementById("profile").innerHTML=
    '<div class="profile-name">'+esc(c.id)+" "+esc(c.name)+'</div><div class="profile-dim">'+esc(c.dim)+"</div>"+
    '<div class="metrics"><div class="metric"><b>'+(c.weight!==null?c.weight:"—")+'</b><span>体重 kg</span></div>'+
    '<div class="metric"><b>'+(c.bmi!==null?c.bmi:"—")+'</b><span>BMI</span></div>'+
    '<div class="metric"><b>'+c.visitCount+'</b><span>就诊次数</span></div></div>'+
    '<dl class="kv">'+rows.map(function(r){return "<dt>"+r[0]+"</dt><dd>"+r[1]+"</dd>";}).join("")+"</dl>"+
    '<div class="sec-t">BMI 分档 / 数据缺口</div><div class="gap-list">'+esc(c.bmiLabel||"无体测数据")+(c.missing.length?"；"+esc(c.missing.slice(0,3).join("；")):"")+"</div>";
}
function renderTabs(){
  document.getElementById("tabs").innerHTML=TABS.map(function(t){
    return '<button type="button" data-tab="'+t[0]+'" class="'+(state.tab===t[0]?"on":"")+'">'+t[1]+"</button>";
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){b.addEventListener("click",function(){setTab(this.dataset.tab);});});
}
function insufficient(c,obj,what){
  return '<div class="insufficient"><b>'+esc(c.name)+'</b> · '+esc(c.dim)+'<br>按提示词输出 <code>{"status":"insufficient_data","missing":[...]}</code>，'+what+'这一页整屏不展示。'+
    '<div class="gap-list" style="margin-top:8px">缺失字段：'+esc(obj.missing.join('、'))+'</div></div>';
}
function drugTable(weight){
  var jin=function(p){return Math.round(weight*p/100*2);};
  var rows=[["1 个月","3%–4%","−"+jin(3)+"~"+jin(4)+" 斤"],["3 个月","8%–10%","−"+jin(8)+"~"+jin(10)+" 斤"],["6 个月","12%–15%","−"+jin(12)+"~"+jin(15)+" 斤"],["12 个月","18%–21%","−"+jin(18)+"~"+jin(21)+" 斤"]];
  return '<table class="tb"><thead><tr><th>周期</th><th>平均减重</th><th>你的参考值</th></tr></thead><tbody>'+
    rows.map(function(r){return "<tr><td>"+r[0]+"</td><td>"+r[1]+"</td><td>"+r[2]+"</td></tr>";}).join("")+"</tbody></table>";
}
function RENDER_ASSESS(c){
  var a=c.a;
  if(a.status!=="ok")return insufficient(c,a,"评估报告");
  var h='<div class="profile-line">'+esc(a.profile)+"</div>";
  var bars="",ax="";
  for(var i=0;i<3;i++){bars+='<i class="'+(i===a.tier-1?"on":"")+'"></i>';ax+='<span class="'+(i===a.tier-1?"on":"")+'">'+TIERS[i]+"</span>";}
  h+='<section class="card wide" style="margin-bottom:14px"><div class="grade__h"><span>减重建议</span><b>'+esc(a.tierLabel)+'</b></div><div class="grade__bar">'+bars+'</div><div class="grade__ax">'+ax+"</div>"+esc(a.reading).replace(/^/,'<p class="reading">')+"</p></section>";
  h+='<section class="card wide" style="margin-bottom:14px"><h3><i>01</i>整体建议</h3><p>'+esc(FIX.stage)+"</p>"+
    '<div class="chain"><span>生活方式</span><i>→</i><span>体重增加</span><i>→</i><span>指标异常</span><i>→</i><span>慢性疾病</span></div>'+
    "<p>"+a.conclusion+"</p>"+
    '<ul class="ul">'+a.findings.map(function(f){return "<li><b>"+esc(f[0])+"</b>："+esc(f[1])+"</li>";}).join("")+"</ul></section>";
  h+='<div class="mods">';
  a.modules.forEach(function(m,i){
    h+='<section class="card"><h3><i>'+("0"+(i+2)).slice(-2)+"</i>"+esc(m.t)+'</h3><p>'+esc(m.lead)+"</p>"+
      '<ul class="ul">'+m.items.map(function(it){return "<li><b>"+esc(it[0])+"</b>："+esc(it[1])+"</li>";}).join("")+"</ul>"+
      (m.note?'<p class="note">'+esc(m.note)+"</p>":"")+"</section>";
  });
  var d=a.drug;
  h+='<section class="card wide"><h3><i>'+("0"+(a.modules.length+2)).slice(-2)+"</i>用药建议</h3>"+
    '<div class="mbar"><span>匹配度</span><b>'+esc(d.bar)+'</b><i style="width:'+d.width+'%"></i></div>';
  if(d.mode==="normal"){
    h+='<p>核心理由是：</p><p class="hl">'+esc(d.reason)+'</p><p>'+esc(FIX.drugLead)+'</p>'+drugTable(c.weight);
  }else{h+="<p>"+esc(d.text)+"</p>";}
  h+="</section></div>";
  h+='<div class="disc">'+esc(FIX.disc)+"</div>";
  return h;
}
function RENDER_MONTHLY(c){
  var m=c.m;
  if(m.status!=="ok")return insufficient(c,m,"示例月报");
  var h='<section class="card" style="margin-bottom:14px"><div class="eyebrow">体重管理 · 第 '+m.no+' 期示例月报 · '+esc(c.name)+'</div><h2>'+esc(m.title)+"</h2>"+
    '<p class="note">'+esc(m.range)+" · "+esc(m.span)+'</p><span class="tag">'+esc(m.tag)+"</span>"+
    '<div class="kpis"><div class="kpi"><b>'+m.end+'</b><span>期末体重 kg</span></div>'+
    '<div class="kpi"><b>'+(m.delta>0?"+":"")+m.delta+'</b><span>'+m.month+'月变化 kg</span></div>'+
    '<div class="kpi"><b>'+(m.total>0?"+":"")+m.total+'</b><span>累计变化 kg</span></div>'+
    '<div class="kpi"><b>'+m.bmi+'</b><span>BMI</span></div>'+
    '<div class="kpi"><b>'+(m.waist!==null?m.waist:"—")+'</b><span>腰围 cm</span></div></div></section>';
  h+='<div class="two"><section class="card"><h3><i>01</i>减重数据分析</h3>'+m.analysis.split("\n").map(function(t){return "<p>"+esc(t)+"</p>";}).join("")+"</section>";
  h+='<section class="card"><h3><i>02</i>'+m.nextMonth+'月的饮食与运动</h3><div class="sec-t">饮食</div><ul class="ul">'+m.diet.map(function(t){return "<li>"+esc(t)+"</li>";}).join("")+'</ul><div class="sec-t">运动</div><ul class="ul">'+m.sport.map(function(t){return "<li>"+esc(t)+"</li>";}).join("")+"</ul></section></div>";
  h+='<section class="card" style="margin-bottom:14px"><h3>体重记录</h3>'+m.svg+"</section>";
  h+='<div class="disc">'+esc(m.note)+"</div>";
  return h;
}
function RENDER_RECAP(c){
  var r=c.r;
  if(r.status!=="ok")return insufficient(c,r,"结营回顾");
  var h='<div class="note" style="margin-bottom:10px">体重描点来自该案例真实体测记录，周数按记录点数折算，非连续周打卡；缺数据的屏整屏不展示。</div>'+
    '<div style="margin-bottom:12px"><button type="button" class="share-btn" onclick="openShare()">生成分享卡</button></div><div class="screens">';
  h+='<section class="screen cover wide" style="text-align:center"><div class="eyebrow">结营回顾 · '+esc(c.name)+'</div><h2>'+FIX.coverH1+'</h2><div class="band">'+esc(r.copy.cover.lead)+'</div><p class="note">'+esc(FIX.coverDisc)+"</p></section>";
  h+='<section class="screen"><div class="eyebrow">01 / 第一次看见变化</div><h2>'+esc(r.copy["01"].h2)+"</h2>"+
    (r.copy["01"].big?'<div class="stat-row"><div class="stat"><b>'+esc(r.copy["01"].big)+' <i style="font-style:normal;font-size:13px">kg</i></b><span>'+esc(r.copy["01"].kicker)+"</span></div></div>":"")+
    "<p>"+esc(r.copy["01"].body)+"</p></section>";
  h+='<section class="screen"><div class="eyebrow">02 / '+esc(r.copy["02"].eyebrow)+'</div><h2>'+esc(r.copy["02"].h2)+"</h2>"+r.screens["02"].svg+"<p>"+esc(r.copy["02"].body)+"</p></section>";
  if(r.screens["03"].show){h+='<section class="screen"><div class="eyebrow">03 / 身体更轻盈</div><h2>'+esc(FIX.s03H2)+"</h2>"+
    '<div class="stat-row">'+r.screens["03"].grid.map(function(g){return '<div class="stat"><b>'+esc(g.v)+' <i style="font-style:normal;font-size:13px">'+esc(g.u)+'</i></b><span>'+esc(g.k)+"</span></div>";}).join("")+"</div><p>"+esc(r.copy["03"].body)+"</p></section>";}
  if(r.screens["05"].show){h+='<section class="screen"><div class="eyebrow">05 / 专业支持的陪伴</div><h2>'+esc(FIX.s05H2)+"</h2><p>"+esc(FIX.s05Before)+"</p>"+
    (r.copy["05"].body_after?"<p>"+esc(r.copy["05"].body_after)+"</p>":"")+"</section>";}
  h+='<section class="screen wide"><div class="eyebrow">'+esc(FIX.s06Eyebrow)+'</div><div class="persona"><b>'+esc(r.persona.name[0])+"<br />"+esc(r.persona.name[1])+'。</b><p>'+esc(r.persona.why)+'</p></div>'+
    '<p class="note" style="text-align:center;margin-top:10px">'+esc(FIX.s06Closing)+'</p><p style="text-align:center"><button type="button" class="share-btn" onclick="openShare()">分享</button></p></section>';
  h+='<section class="screen wide"><div class="eyebrow">'+esc(FIX.s07Eyebrow)+'</div><h2>'+esc(FIX.s07H2)+"</h2><p>"+esc(FIX.s07Body1)+"</p><p>"+esc(FIX.s07Body2)+"</p><p><b>"+esc(r.copy["07"].strong)+"</b></p></section>";
  h+="</div>";
  h+='<div class="disc">示例回顾：按现有真实体测记录生成，缺数据的屏整屏不展示。</div>';
  return h;
}
function renderMain(){
  var c=curCase(),fn=state.tab==="monthly"?RENDER_MONTHLY:state.tab==="recap"?RENDER_RECAP:RENDER_ASSESS;
  document.getElementById("view").innerHTML=fn(c);
  var t=TABS.filter(function(x){return x[0]===state.tab;})[0];
  document.getElementById("viewTitle").textContent=c.name+" · "+t[1];
  document.getElementById("viewTag").textContent=c.dim;
}
function render(){renderSide();renderTabs();renderMain();setUrl();document.title=curCase().name+" · 代表案例工作台";}
function setCase(id){state.id=id;render();}
function setTab(tab){state.tab=tab;render();}
function wrapText(ctx,text,x,y,maxW,lh){var line="",yy=y;for(var i=0;i<text.length;i++){var t=line+text[i];if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,yy);yy+=lh;line=text[i];}else line=t;}if(line)ctx.fillText(line,x,yy);return yy;}
function paintShare(){
  var c=curCase(),r=c.r;if(r.status!=="ok")return;
  var cv=document.getElementById("shareCanvas"),ctx=cv.getContext("2d"),priv=document.getElementById("sharePrivate").checked;
  ctx.clearRect(0,0,750,1334);
  var g=ctx.createLinearGradient(0,0,0,1334);g.addColorStop(0,"#D9EEF3");g.addColorStop(1,"#F7FBFB");ctx.fillStyle=g;ctx.fillRect(0,0,750,1334);
  ctx.fillStyle="#fff";ctx.fillRect(40,170,670,1010);
  ctx.textAlign="center";ctx.fillStyle="#006F8A";ctx.font='bold 62px "PingFang SC","Microsoft YaHei",Arial';
  ctx.fillText(r.persona.name[0],375,290);ctx.fillText(r.persona.name[1]+"。",375,370);
  ctx.fillStyle="#3D474B";ctx.font='26px "PingFang SC","Microsoft YaHei",Arial';ctx.textAlign="left";
  wrapText(ctx,r.persona.share,105,450,540,42);
  if(!priv){ctx.textAlign="center";ctx.fillStyle="#879397";ctx.font='24px "PingFang SC","Microsoft YaHei",Arial';ctx.fillText("成功减重",375,660);
    ctx.fillStyle="#006F8A";ctx.font='bold 96px "PingFang SC","Microsoft YaHei",Arial';ctx.fillText(r.share.delta,375,770);}
  if(!priv){ctx.beginPath();ctx.arc(120,1080,44,0,Math.PI*2);ctx.fillStyle="#DCEBF0";ctx.fill();
    ctx.fillStyle="#006F8A";ctx.font='26px "PingFang SC","Microsoft YaHei",Arial';ctx.textAlign="center";ctx.fillText("头像",120,1090);
    ctx.fillStyle="#3D474B";ctx.font='22px "PingFang SC","Microsoft YaHei",Arial';ctx.textAlign="left";ctx.fillText(c.name,180,1090);}
  if(QR_DATA){var img=new Image();img.onload=function(){try{ctx.drawImage(img,540,1030,150,150);}catch(e){}};img.src=QR_DATA;}
  ctx.fillStyle="#879397";ctx.font='20px "PingFang SC","Microsoft YaHei",Arial';ctx.textAlign="right";ctx.fillText("扫码了解",690,1210);
}
function openShare(){var c=curCase();if(c.r.status!=="ok")return;document.getElementById("shareMask").hidden=false;paintShare();}
function closeShare(){document.getElementById("shareMask").hidden=true;}
function saveShare(){var a=document.createElement("a");a.download=FIX.sheetFile;a.href=document.getElementById("shareCanvas").toDataURL("image/png");a.click();}
render();
document.getElementById("shareClose").addEventListener("click",closeShare);
document.getElementById("shareSave").addEventListener("click",saveShare);
document.getElementById("sharePrivate").addEventListener("change",paintShare);
document.getElementById("shareMask").addEventListener("click",function(e){if(e.target===this)closeShare();});

</script>
</body>
</html>
