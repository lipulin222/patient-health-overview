<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>减重月报</title>
<style>
:root{--brand:#006F8A;--brand2:#009BBF;--bg:#F2F5F6;--line:#E5EBED;--ink:#1A1A1A;--ink2:#3D474B;--muted:#879397;--hi:#D54941;--warn:#C77C0A}
*{box-sizing:border-box}
body{margin:0;background:#E9EEF0;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
.shell{max-width:420px;margin:0 auto;background:var(--bg);min-height:100vh;box-shadow:0 0 24px rgba(0,111,138,.08)}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top b{color:var(--brand);font-size:16px;white-space:nowrap}
.top select{flex:1;min-width:150px;height:32px;border:1px solid var(--line);border-radius:7px;background:#F8FAFB;color:var(--ink2);padding:0 6px;font-size:13px;font-family:inherit}
.top a{color:var(--brand);font-size:13px;text-decoration:none;white-space:nowrap}
.wrap{padding:12px 14px 32px}
.hero,.card,.screen{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,111,138,.04)}
.eyebrow{font-size:12px;color:var(--brand2);letter-spacing:1px;margin:0 0 6px}
.hero__hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.hero__hd b{font-size:22px;color:var(--brand)}
.hero__hd span{font-size:13px;color:var(--muted)}
.grade{margin-top:14px}
.grade__h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.grade__h b{color:var(--brand);font-size:15px}
.grade__bar{display:flex;gap:4px;margin:8px 0 6px}
.grade__bar i{flex:1;height:7px;border-radius:4px;background:#E8EEF0}
.grade__bar i.on{background:var(--brand2)}
.grade__ax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.grade__ax .on{color:var(--brand);font-weight:600}
.hint{display:block;margin-top:12px;padding:10px 12px;background:#F3FAFB;border-left:3px solid var(--brand2);border-radius:0 8px 8px 0;font-size:14px;color:var(--ink2)}
.card h3,.screen h2{font-size:17px;color:var(--brand);margin:0 0 8px}
.card h3 i{font-style:normal;color:var(--brand2);font-size:13px;margin-right:8px}
.card__b p,.screen p{margin:0 0 10px;font-size:14px;color:var(--ink2)}
.ul{margin:8px 0;padding-left:18px}
.ul li{margin-bottom:6px;font-size:14px;color:var(--ink2)}
.ul b{color:var(--ink)}
.note{font-size:12.5px !important;color:var(--muted) !important}
.mbar{display:flex;align-items:center;gap:8px;background:#F3FAFB;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.mbar b{color:var(--brand)}
.mbar i{height:6px;background:var(--brand2);border-radius:4px;display:block;min-width:8px}
.tb{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.tb th,.tb td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.tb th{background:#F6FAFB;color:var(--ink2);font-weight:600}
.disc,.disc-sm{font-size:12px;color:var(--muted);padding:10px 4px;line-height:1.7}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;background:#EAF6F8;color:var(--brand);margin-bottom:8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.kpi{background:#F6FAFB;border-radius:8px;padding:8px 6px;text-align:center}
.kpi b{display:block;font-size:16px;color:var(--brand)}
.kpi span{font-size:11px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;background:#FBFCFD;border-radius:8px}
.sec-t{font-size:14px;color:var(--brand);font-weight:600;margin:14px 0 6px}
.band{height:88px;border-radius:10px;background:linear-gradient(135deg,#D9EEF3,#EAF6F8 60%,#F7FBFB);margin:10px 0;display:flex;align-items:center;justify-content:center;color:var(--brand);font-size:13px;letter-spacing:1px}
.persona{background:#F3FAFB;border-radius:10px;padding:14px;text-align:center}
.persona b{display:block;font-size:19px;color:var(--brand);line-height:1.5}
.persona p{font-size:13px;color:var(--ink2);margin:8px 0 0}
.stat-row{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:90px;background:#F6FAFB;border-radius:8px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--brand)}
.stat span{font-size:12px;color:var(--muted)}
.insufficient{background:#FFF8EC;border:1px solid #F3DFC0;color:#8A6420;border-radius:10px;padding:14px;font-size:14px}
.back{display:block;text-align:center;color:var(--brand);font-size:13px;text-decoration:none;margin:6px 0 14px}
</style>
</head>
<body>
<div class="shell"><div class="top"><b>减重月报</b><select id="who" aria-label="切换代表案例"></select><a href="index.html">索引</a></div><div class="wrap"><a class="back" href="index.html">← 返回 8 位代表案例索引</a><div class="tag">8 位代表案例 · 1 个月示例</div><div id="view"></div></div></div>
<script>
var CASES = [{"id":"C1","name":"沈知远","dim":"有化验异常","m":{"status":"ok","no":1,"month":11,"nextMonth":12,"tag":"稳步推进","title":"第一个月：体重有了变化","range":"8月26日 – 11月4日","span":"按现有 3 次体测记录 · 示例期","weeks":[84.9,79,74.7],"weekLabels":["开始","10/04","11/04"],"end":74.7,"delta":-10.2,"total":-10.2,"bmi":24.4,"waist":92.2,"analysis":"截至 11月，已关联的 3 次体测记录从 84.9kg 到 74.7kg，变化 -10.2kg，按记录顺序在下降。体检记录里有多项化验指标异常，这一期没有记录到需要改动的饮食或运动安排，这一期没有找到需要改动的地方，先照现在的用药继续观察。\n12月先把复查时间定下来，让医生结合这一期的记录看指标变化；用药剂量与进阶幅度，复查时医生会按 11月的记录来定。","diet":["12月胃口受药物影响时把一顿拆成两三次，先保证吃得下","12月每餐按一掌蛋白、一拳主食、一捧蔬菜安排，不额外压低饭量","12月外食把酱汁另装，甜饮换成温水，记录打勾即可"],"sport":["12月维持原来的走动，不新增训练","12月久坐到下午起身走 10 分钟，算作一次活动","12月胸痛、明显气促或头晕时停下并联系医生"],"note":"示例月报：体重描点取自该案例真实体测记录，未补写问卷打卡；不构成医嘱。"}},{"id":"C2","name":"程若溪","dim":"有检查异常","m":{"status":"ok","no":1,"month":11,"nextMonth":12,"tag":"遇到平台","title":"第一个月：先把节奏稳住","range":"7月23日 – 11月6日","span":"按现有 5 次体测记录 · 示例期","weeks":[62.9,63,62.9,63,63],"weekLabels":["开始","08/21","09/09","09/29","11/06"],"end":63,"delta":0.1,"total":0.1,"bmi":23.7,"waist":89.5,"analysis":"截至 11月，已关联的 5 次体测记录从 62.9kg 到 63.0kg，变化 +0.1kg，体重几乎没动。检查发现需要医生核对，这一期没有记录到需要改动的饮食或运动安排，这一期没有找到需要改动的地方，先照现在的用药继续观察。\n12月把影像与检查报告带到面诊，由医生判断减重节奏；用药剂量与进阶幅度，复查时医生会按 11月的记录来定。","diet":["12月三餐时段先固定下来，不因为检查发现自行改饭量","12月每餐留一掌蛋白，蔬菜与主食按原来的量安排","12月恶心或吃不下时先放一放，别硬凑一顿"],"sport":["12月维持原来的走动，不加量","12月力量动作一次只做一种，吃力就停","12月关节剧痛时停止运动并联系医生"],"note":"示例月报：体重描点取自该案例真实体测记录，未补写问卷打卡；不构成医嘱。"}},{"id":"C3","name":"叶知秋","dim":"有不良反应","m":{"status":"ok","no":1,"month":11,"nextMonth":12,"tag":"稳步推进","title":"第一个月：体重有了变化","range":"7月23日 – 11月6日","span":"按现有 5 次体测记录 · 示例期","weeks":[76,72.6,69.8,67,65],"weekLabels":["开始","08/14","09/12","10/09","11/06"],"end":65,"delta":-11,"total":-11,"bmi":25.1,"waist":95.2,"analysis":"截至 11月，已关联的 5 次体测记录从 76.0kg 到 65.0kg，变化 -11.0kg，按记录顺序在下降。这一期记录了多条用药后的身体反应，以胃肠道感受为主，这一期没有找到需要改动的地方，先照现在的用药继续观察。\n12月先让身体适应，再由医生判断要不要调整方案；用药剂量与进阶幅度，复查时医生会按 11月的记录来定。","diet":["12月持续呕吐、明显腹痛或皮肤眼白发黄时先联系医生，不自行加药","12月胃口小的时候把一顿拆成两三次，避开口味重的菜","12月打嗝腹胀明显那几天，主食按一拳起步，别再压量"],"sport":["12月用药早期不安排新训练，维持原来的走动","12月头晕或起身不适时先坐下，当天不增加活动","12月每次仍以 10 分钟为上限，吃力就停"],"note":"示例月报：体重描点取自该案例真实体测记录，未补写问卷打卡；不构成医嘱。"}},{"id":"C4","name":"江晚晴","dim":"体重回升","m":{"status":"ok","no":1,"month":11,"nextMonth":12,"tag":"稳步推进","title":"第一个月：体重有了变化","range":"11月18日 – 11月6日","span":"按现有 5 次体测记录 · 示例期","weeks":[49.2,45.2,46.5,46.2,46.2],"weekLabels":["开始","12/23","06/06","08/19","11/06"],"end":46.2,"delta":-3,"total":-3,"bmi":20.5,"waist":68,"analysis":"截至 11月，已关联的 5 次体测记录从 49.2kg 到 46.2kg，变化 -3.0kg，按记录顺序在下降。体重从记录里的最低点回升，这一期没有记录到明确的饮食或运动变化，这一期没有找到需要改动的地方，先照现在的用药继续观察。\n12月先固定三餐时段与称重时间，看回升集中在哪一段；用药剂量与进阶幅度，复查时医生会按 11月的记录来定。","diet":["12月三餐时段固定下来，不加餐也不刻意省一顿","12月每餐按一掌蛋白、一拳主食、一捧蔬菜，先看两周记录","12月外食与夜宵打勾即可，不追着上一期补"],"sport":["12月维持原来的走动，不因回升加练","12月每周固定同一天早上称重，记一次就够","12月膝痛或明显气促时停止并联系医生"],"note":"示例月报：体重描点取自该案例真实体测记录，未补写问卷打卡；不构成医嘱。"}},{"id":"C5","name":"唐以宁","dim":"体重记录超 90 天","m":{"status":"ok","no":1,"month":7,"nextMonth":8,"tag":"稳步推进","title":"第一个月：体重有了变化","range":"5月6日 – 7月22日","span":"按现有 5 次体测记录 · 示例期","weeks":[80,77,77,75,78.3],"weekLabels":["开始","06/16","07/21","07/21","07/22"],"end":78.3,"delta":-1.7,"total":-1.7,"bmi":26.5,"waist":90.5,"analysis":"截至 7月，已关联的 5 次体测记录从 80.0kg 到 78.3kg，变化 -1.7kg，按记录顺序在下降。就诊记录还在更新，体重已经很久没有新的实测值，这一期没有找到需要改动的地方，先照现在的用药继续观察。\n8月把体重记录接上，再由医生结合这一段就诊记录看趋势；用药剂量与进阶幅度，复查时医生会按 7月的记录来定。","diet":["8月三餐按原来的节奏安排，不因为缺少称重改饭量","8月每餐留一掌蛋白，蔬菜与主食照常","8月外食与甜饮打勾，方便复查时对上时间"],"sport":["8月维持原来的走动，不加量","8月每周固定一天早上称重，补上这一段的记录","8月头晕或关节剧痛时停止并联系医生"],"note":"示例月报：体重描点取自该案例真实体测记录，未补写问卷打卡；不构成医嘱。"}},{"id":"C6","name":"孟昭然","dim":"合并长期用药","m":{"status":"ok","no":1,"month":11,"nextMonth":12,"tag":"稳步推进","title":"第一个月：体重有了变化","range":"9月11日 – 11月6日","span":"按现有 5 次体测记录 · 示例期","weeks":[83,79,81.7,78.8,77],"weekLabels":["开始","10/09","10/09","10/09","11/06"],"end":77,"delta":-6,"total":-6,"bmi":30.5,"waist":107.2,"analysis":"截至 11月，已关联的 5 次体测记录从 83.0kg 到 77.0kg，变化 -6.0kg，按记录顺序在下降。记录里有需要长期使用的药物，这一期没有记录到需要改动的饮食或运动安排，这一期没有找到需要改动的地方，先照现在的用药继续观察。\n12月把现有用药与体重管理放到同一次面诊里评估；用药剂量与进阶幅度，复查时医生会按 11月的记录来定。","diet":["12月按医生给的用药时间排三餐，不自行改饭量","12月每餐按一掌蛋白、一拳主食、一捧蔬菜起步","12月恶心或吃不下时先放一放，别空腹硬撑"],"sport":["12月先在平地慢走，不安排跑跳","12月起身头晕时先坐下，当天不增加活动","12月运动前由医生核对现有用药与身体状态"],"note":"示例月报：体重描点取自该案例真实体测记录，未补写问卷打卡；不构成医嘱。"}},{"id":"C7","name":"钟亦晴","dim":"无体测数据","m":{"status":"insufficient","reason":"该案例的体测记录不足 2 次，无法组成一期示例月报","points":0}},{"id":"C8","name":"宋清欢","dim":"资料较少","m":{"status":"insufficient","reason":"该案例的体测记录不足 2 次，无法组成一期示例月报","points":1}}];
var esc=function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});};
var q=new URLSearchParams(location.search),cur=q.get("id")||CASES[0].id,sel=document.getElementById("who");
CASES.forEach(function(c){var o=document.createElement("option");o.value=c.id;o.textContent=c.id+" "+c.name+" · "+c.dim;sel.appendChild(o);});
sel.value=cur;sel.addEventListener("change",function(){var u=new URL(location.href);u.searchParams.set("id",this.value);location.href=u.toString();});
function BODY(c){
  var m=c.m;
  if(m.status!=="ok") return '<div class="insufficient"><b>'+esc(c.name)+'</b> · '+esc(c.dim)+'<br>'+esc(m.reason)+'，按数据不足处理，不生成示例月报。</div><div class="disc">示例月报仅使用真实体测记录，不补写问卷打卡。</div>';
  var h='<div class="note" style="margin-bottom:10px">示例期按现有真实体测记录整理，非连续周打卡；不构成医嘱。</div>';
  h+='<section class="hero"><div class="eyebrow">体重管理 · 第 1 期示例月报 · '+esc(c.name)+'</div><h2 style="font-size:19px;color:#006F8A;margin:0 0 4px">'+esc(m.title)+'</h2>';
  h+='<p class="note">'+esc(m.range)+" · "+esc(m.span)+'</p><span class="tag">'+esc(m.tag)+'</span>';
  h+='<div class="kpis"><div class="kpi"><b>'+(m.delta>0?"+":"")+m.delta+'</b><span>'+m.month+'月变化 kg</span></div><div class="kpi"><b>'+m.total+'</b><span>累计变化 kg</span></div><div class="kpi"><b>'+m.bmi+'</b><span>BMI</span></div><div class="kpi"><b>'+(m.waist!==null?m.waist:"—")+'</b><span>腰围 cm</span></div></div>';
  h+='</section>';
  h+='<section class="card"><h3><i>01</i>减重数据分析</h3>'+m.analysis.split(String.fromCharCode(10)).map(function(t){return '<p>'+esc(t)+'</p>';}).join("")+'</section>';
  h+='<section class="card"><h3><i>02</i>'+m.nextMonth+'月的饮食与运动</h3><div class="sec-t">饮食</div><ul class="ul">'+m.diet.map(function(t){return '<li>'+esc(t)+'</li>';}).join("")+'</ul>';
  h+='<div class="sec-t">运动</div><ul class="ul">'+m.sport.map(function(t){return '<li>'+esc(t)+'</li>';}).join("")+'</ul></section>';
  h+='<div class="disc">'+esc(m.note)+' 期头、概览与审核信息由页面模板生成。</div>';
  return h;
}
function render(){var c=CASES.filter(function(x){return x.id===cur;})[0]||CASES[0];document.getElementById("view").innerHTML=BODY(c);document.title=c.name+" · 减重月报";}
render();
</script>
</body>
