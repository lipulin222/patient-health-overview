<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>减重评估报告</title>
<style>
:root{--brand:#006F8A;--brand2:#009BBF;--bg:#F2F5F6;--line:#E5EBED;--ink:#1A1A1A;--ink2:#3D474B;--muted:#879397;--hi:#D54941;--warn:#C77C0A}
*{box-sizing:border-box}
body{margin:0;background:#E9EEF0;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
.shell{max-width:420px;margin:0 auto;background:var(--bg);min-height:100vh;box-shadow:0 0 24px rgba(0,111,138,.08)}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top b{color:var(--brand);font-size:16px;white-space:nowrap}
.top select{flex:1;min-width:150px;height:32px;border:1px solid var(--line);border-radius:7px;background:#F8FAFB;color:var(--ink2);padding:0 6px;font-size:13px;font-family:inherit}
.top a{color:var(--brand);font-size:13px;text-decoration:none;white-space:nowrap}
.wrap{padding:12px 14px 32px}
.hero,.card,.screen{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,111,138,.04)}
.eyebrow{font-size:12px;color:var(--brand2);letter-spacing:1px;margin:0 0 6px}
.hero__hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.hero__hd b{font-size:22px;color:var(--brand)}
.hero__hd span{font-size:13px;color:var(--muted)}
.grade{margin-top:14px}
.grade__h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.grade__h b{color:var(--brand);font-size:15px}
.grade__bar{display:flex;gap:4px;margin:8px 0 6px}
.grade__bar i{flex:1;height:7px;border-radius:4px;background:#E8EEF0}
.grade__bar i.on{background:var(--brand2)}
.grade__ax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.grade__ax .on{color:var(--brand);font-weight:600}
.hint{display:block;margin-top:12px;padding:10px 12px;background:#F3FAFB;border-left:3px solid var(--brand2);border-radius:0 8px 8px 0;font-size:14px;color:var(--ink2)}
.card h3,.screen h2{font-size:17px;color:var(--brand);margin:0 0 8px}
.card h3 i{font-style:normal;color:var(--brand2);font-size:13px;margin-right:8px}
.card__b p,.screen p{margin:0 0 10px;font-size:14px;color:var(--ink2)}
.ul{margin:8px 0;padding-left:18px}
.ul li{margin-bottom:6px;font-size:14px;color:var(--ink2)}
.ul b{color:var(--ink)}
.note{font-size:12.5px !important;color:var(--muted) !important}
.mbar{display:flex;align-items:center;gap:8px;background:#F3FAFB;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.mbar b{color:var(--brand)}
.mbar i{height:6px;background:var(--brand2);border-radius:4px;display:block;min-width:8px}
.tb{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.tb th,.tb td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.tb th{background:#F6FAFB;color:var(--ink2);font-weight:600}
.disc,.disc-sm{font-size:12px;color:var(--muted);padding:10px 4px;line-height:1.7}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;background:#EAF6F8;color:var(--brand);margin-bottom:8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.kpi{background:#F6FAFB;border-radius:8px;padding:8px 6px;text-align:center}
.kpi b{display:block;font-size:16px;color:var(--brand)}
.kpi span{font-size:11px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;background:#FBFCFD;border-radius:8px}
.sec-t{font-size:14px;color:var(--brand);font-weight:600;margin:14px 0 6px}
.band{height:88px;border-radius:10px;background:linear-gradient(135deg,#D9EEF3,#EAF6F8 60%,#F7FBFB);margin:10px 0;display:flex;align-items:center;justify-content:center;color:var(--brand);font-size:13px;letter-spacing:1px}
.persona{background:#F3FAFB;border-radius:10px;padding:14px;text-align:center}
.persona b{display:block;font-size:19px;color:var(--brand);line-height:1.5}
.persona p{font-size:13px;color:var(--ink2);margin:8px 0 0}
.stat-row{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:90px;background:#F6FAFB;border-radius:8px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--brand)}
.stat span{font-size:12px;color:var(--muted)}
.insufficient{background:#FFF8EC;border:1px solid #F3DFC0;color:#8A6420;border-radius:10px;padding:14px;font-size:14px}
.back{display:block;text-align:center;color:var(--brand);font-size:13px;text-decoration:none;margin:6px 0 14px}
</style>
</head>

<script>
var CASES = [{"id":"C1","name":"沈知远","dim":"有化验异常","gender":"男","age":27.8,"height":175,"weight":74.7,"bmi":24.4,"a":{"tier":"normal","tierLabel":"需要减重管理","cur":2,"hint":"当前 BMI 24.4，并伴有化验异常，建议饮食、运动与医生评估同步开展。","mods":[{"t":"整体建议","html":"\u003cp>最近一次实测 74.7kg（11月4日），BMI 24.4（超重），化验异常 8 项，检查异常 3 项，不良反应 1 条。这些记录来自已关联的体测、化验、检查与就诊资料，问卷未覆盖的部分由医生面诊时补充。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>当下最需要解决的\u003c/b>：先把体检里出现的异常指标与减重安排放到一起看，避免只盯体重\u003c/li>\u003cli>\u003cb>现有记录里的线索\u003c/b>：肝功异常 1 项；检查异常 3 项（含需重点核对发现）\u003c/li>\u003c/ul>"},{"t":"饮食建议","html":"\u003cp>已有化验指标异常，饮食调整的重点是让每餐结构稳定，而不是额外压低饭量。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>每餐怎么安排\u003c/b>：按一掌蛋白、一拳主食、一捧蔬菜起步，先固定三餐时段\u003c/li>\u003cli>\u003cb>用药后胃口变小\u003c/b>：把一顿拆成两三次，清淡少量，恶心明显时先放一放\u003c/li>\u003cli>\u003cb>记录做到什么程度\u003c/b>：体重每周记 1 次、腰围每月记 1 次即可，外食与甜饮打勾\u003c/li>\u003c/ul>\u003cp class=\"note\">营养师会按复查记录给出个性化方案。\u003c/p>"},{"t":"运动建议","html":"\u003cp>运动先从维持原有走动开始，等身体适应后再考虑增加次数，避免在用药早期同时改动太多安排。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>起步量\u003c/b>：在现状上每天多走 1000 步，久坐时起身走动\u003c/li>\u003cli>\u003cb>力量与有氧\u003c/b>：适应后抗阻每周 2 次、每次 10–15 分钟，有氧每周 3 次、每次 10–20 分钟\u003c/li>\u003cli>\u003cb>需要停下的时候\u003c/b>：胸痛、明显气促、头晕或关节剧痛时立即停止并联系医生\u003c/li>\u003c/ul>"},{"t":"用药建议","html":"\u003cdiv class=\"mbar\">\u003cspan>匹配度\u003c/span>\u003cb>较高\u003c/b>\u003ci style=\"width:78%\">\u003c/i>\u003c/div>\u003cp>结合你的体重与体检记录，建议在调整饮食和运动的同时配合药物：它通过延缓胃排空、降低食欲减少摄入，让控制饮食的过程少一些饥饿感。\u003c/p>\u003cp>根据你当前的体重情况，参考按临床数据，用药后的体重预计变化情况如下：\u003c/p>\u003ctable class=\"tb\">\u003cthead>\u003ctr>\u003cth>周期\u003c/th>\u003cth>平均减重\u003c/th>\u003cth>你的参考值\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1 个月\u003c/td>\u003ctd>3%–4%\u003c/td>\u003ctd>−4~6 斤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 个月\u003c/td>\u003ctd>8%–10%\u003c/td>\u003ctd>−12~15 斤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6 个月\u003c/td>\u003ctd>12%–15%\u003c/td>\u003ctd>−18~22 斤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12 个月\u003c/td>\u003ctd>18%–21%\u003c/td>\u003ctd>−27~31 斤\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>用药前你可能想确认的：\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>用药能多减多少\u003c/b>：单靠生活方式一年通常减掉体重的 3%–5%，配合药物后的幅度见上表\u003c/li>\u003cli>\u003cb>用药安全吗\u003c/b>：已在国内外获批用于体重管理，医生评估通过后从小剂量开始，用药期间按随访计划监测\u003c/li>\u003cli>\u003cb>是否会依赖\u003c/b>：这类药物不是成瘾性药物，停药后由生活习惯接管维持\u003c/li>\u003cli>\u003cb>是否需要长期使用\u003c/b>：达到目标后按复查结果逐步减量，多数人不需要一直使用\u003c/li>\u003cli>\u003cb>胃肠道反应\u003c/b>：多在前 4 周逐渐适应，不适明显时随时联系医生调整\u003c/li>\u003c/ul>\u003cp>用药期间需留意已有异常指标的波动，复查时把前后两次记录放在一起看。\u003c/p>\u003cp class=\"note\">上述区间来自临床研究，个体差异较大，以实际随访数据为准。\u003c/p>"}],"disc":"本页内容基于你填写的问卷与已关联的健康数据生成，为初步评估建议，不构成诊断和处方。"}},{"id":"C2","name":"程若溪","dim":"有检查异常","gender":"女","age":46,"height":163,"weight":63,"bmi":23.7,"a":{"tier":"normal","tierLabel":"需要减重管理","cur":2,"hint":"当前 BMI 23.7，并伴有化验异常，建议饮食、运动与医生评估同步开展。","mods":[{"t":"整体建议","html":"\u003cp>最近一次实测 63.0kg（11月6日），BMI 23.7（正常），化验异常 10 项，检查异常 26 项，不良反应 2 条。这些记录来自已关联的体测、化验、检查与就诊资料，问卷未覆盖的部分由医生面诊时补充。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>当下最需要解决的\u003c/b>：影像与检查发现需要医生先核对，再决定减重的节奏\u003c/li>\u003cli>\u003cb>现有记录里的线索\u003c/b>：检查异常 26 项（含需重点核对发现）；肾功 / 尿酸异常 1 项\u003c/li>\u003c/ul>"},{"t":"饮食建议","html":"\u003cp>已有化验指标异常，饮食调整的重点是让每餐结构稳定，而不是额外压低饭量。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>每餐怎么安排\u003c/b>：按一掌蛋白、一拳主食、一捧蔬菜起步，先固定三餐时段\u003c/li>\u003cli>\u003cb>用药后胃口变小\u003c/b>：把一顿拆成两三次，清淡少量，恶心明显时先放一放\u003c/li>\u003cli>\u003cb>记录做到什么程度\u003c/b>：体重每周记 1 次、腰围每月记 1 次即可，外食与甜饮打勾\u003c/li>\u003c/ul>\u003cp class=\"note\">营养师会按复查记录给出个性化方案。\u003c/p>"},{"t":"运动建议","html":"\u003cp>运动先从维持原有走动开始，等身体适应后再考虑增加次数，避免在用药早期同时改动太多安排。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>起步量\u003c/b>：在现状上每天多走 1000 步，久坐时起身走动\u003c/li>\u003cli>\u003cb>力量与有氧\u003c/b>：适应后抗阻每周 2 次、每次 10–15 分钟，有氧每周 3 次、每次 10–20 分钟\u003c/li>\u003cli>\u003cb>需要停下的时候\u003c/b>：胸痛、明显气促、头晕或关节剧痛时立即停止并联系医生\u003c/li>\u003c/ul>"},{"t":"用药建议","html":"\u003cdiv class=\"mbar\">\u003cspan>匹配度\u003c/span>\u003cb>较高\u003c/b>\u003ci style=\"width:78%\">\u003c/i>\u003c/div>\u003cp>结合你的体重与体检记录，建议在调整饮食和运动的同时配合药物：它通过延缓胃排空、降低食欲减少摄入，让控制饮食的过程少一些饥饿感。\u003c/p>\u003cp>根据你当前的体重情况，参考按临床数据，用药后的体重预计变化情况如下：\u003c/p>\u003ctable class=\"tb\">\u003cthead>\u003ctr>\u003cth>周期\u003c/th>\u003cth>平均减重\u003c/th>\u003cth>你的参考值\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1 个月\u003c/td>\u003ctd>3%–4%\u003c/td>\u003ctd>−4~5 斤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 个月\u003c/td>\u003ctd>8%–10%\u003c/td>\u003ctd>−10~13 斤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6 个月\u003c/td>\u003ctd>12%–15%\u003c/td>\u003ctd>−15~19 斤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12 个月\u003c/td>\u003ctd>18%–21%\u003c/td>\u003ctd>−23~26 斤\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>用药前你可能想确认的：\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>用药能多减多少\u003c/b>：单靠生活方式一年通常减掉体重的 3%–5%，配合药物后的幅度见上表\u003c/li>\u003cli>\u003cb>用药安全吗\u003c/b>：已在国内外获批用于体重管理，医生评估通过后从小剂量开始，用药期间按随访计划监测\u003c/li>\u003cli>\u003cb>是否会依赖\u003c/b>：这类药物不是成瘾性药物，停药后由生活习惯接管维持\u003c/li>\u003cli>\u003cb>是否需要长期使用\u003c/b>：达到目标后按复查结果逐步减量，多数人不需要一直使用\u003c/li>\u003cli>\u003cb>胃肠道反应\u003c/b>：多在前 4 周逐渐适应，不适明显时随时联系医生调整\u003c/li>\u003c/ul>\u003cp>用药期间需留意已有异常指标的波动，复查时把前后两次记录放在一起看。\u003c/p>\u003cp class=\"note\">上述区间来自临床研究，个体差异较大，以实际随访数据为准。\u003c/p>"},{"t":"就诊建议","html":"\u003cp>检查发现需要医生核对，面诊时把影像与检查报告一并带上。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>面诊看什么\u003c/b>：由医生结合原始记录判断体重管理方式与用药适用性\u003c/li>\u003cli>\u003cb>复查怎么安排\u003c/b>：按医生给出的复查计划回看指标变化\u003c/li>\u003c/ul>"}],"disc":"本页内容基于你填写的问卷与已关联的健康数据生成，为初步评估建议，不构成诊断和处方。"}},{"id":"C3","name":"叶知秋","dim":"有不良反应","gender":"女","age":33.6,"height":161,"weight":65,"bmi":25.1,"a":{"tier":"offline","tierLabel":"需要减重与慢病结合管理","cur":3,"hint":"已关联的用药记录里存在需要医生统一评估的长期用药，建议先在内科面诊，把现有用药与体重管理放到同一份方案里。","mods":[{"t":"整体建议","html":"\u003cp>最近一次实测 65.0kg（11月6日），BMI 25.1（超重），不良反应 22 条，长期用药记录 1 类。这些记录来自已关联的体测、化验、检查与就诊资料，问卷未覆盖的部分由医生面诊时补充。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>当下最需要解决的\u003c/b>：用药后的身体反应已经影响到日常状态，先让耐受性稳定下来\u003c/li>\u003cli>\u003cb>现有记录里的线索\u003c/b>：累计 22 条不良反应记录；病历提及「血糖 / 糖尿病」相关表述 1 次\u003c/li>\u003c/ul>"},{"t":"饮食建议","html":"\u003cp>体重管理期间，饮食的作用是把摄入稳定在可长期维持的水平，不需要一次性改掉所有习惯。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>每餐怎么安排\u003c/b>：按一掌蛋白、一拳主食、一捧蔬菜起步，先固定三餐时段\u003c/li>\u003cli>\u003cb>用药后胃口变小\u003c/b>：把一顿拆成两三次，清淡少量，恶心明显时先放一放\u003c/li>\u003cli>\u003cb>记录做到什么程度\u003c/b>：体重每周记 1 次、腰围每月记 1 次即可，外食与甜饮打勾\u003c/li>\u003c/ul>\u003cp class=\"note\">营养师会按复查记录给出个性化方案。\u003c/p>"},{"t":"运动建议","html":"\u003cp>运动先从维持原有走动开始，等身体适应后再考虑增加次数，避免在用药早期同时改动太多安排。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>起步量\u003c/b>：在现状上每天多走 1000 步，久坐时起身走动\u003c/li>\u003cli>\u003cb>力量与有氧\u003c/b>：适应后抗阻每周 2 次、每次 10–15 分钟，有氧每周 3 次、每次 10–20 分钟\u003c/li>\u003cli>\u003cb>需要停下的时候\u003c/b>：胸痛、明显气促、头晕或关节剧痛时立即停止并联系医生\u003c/li>\u003c/ul>"},{"t":"用药建议","html":"\u003cdiv class=\"mbar\">\u003cspan>匹配度\u003c/span>\u003cb>需医生面诊评估\u003c/b>\u003ci style=\"width:65%\">\u003c/i>\u003c/div>\u003cp>你目前的长期用药与减重药物之间可能相互影响，需要由医生把两类用药放在一起评估后再决定是否使用。\u003c/p>\u003cp class=\"note\">匹配度基于已关联的用药记录估算，个体差异较大。\u003c/p>"},{"t":"就诊建议","html":"\u003cp>现有长期用药需要医生统一评估，建议带上用药清单到内科面诊。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>面诊看什么\u003c/b>：由医生结合原始记录判断体重管理方式与用药适用性\u003c/li>\u003cli>\u003cb>复查怎么安排\u003c/b>：按医生给出的复查计划回看指标变化\u003c/li>\u003c/ul>"}],"disc":"本页内容基于你填写的问卷与已关联的健康数据生成，为初步评估建议，不构成诊断和处方。"}},{"id":"C4","name":"江晚晴","dim":"体重回升","gender":"女","age":38,"height":150,"weight":46.2,"bmi":20.5,"a":{"tier":"exclude","tierLabel":"无需减重","cur":1,"hint":"按现有体重与体检记录，不需要专门的减重干预；把日常饮食和运动稳定下来，定期复查已有指标即可。","mods":[{"t":"整体建议","html":"\u003cp>最近一次实测 46.2kg（11月6日），BMI 20.5（正常），不良反应 1 条。这些记录来自已关联的体测、化验、检查与就诊资料，问卷未覆盖的部分由医生面诊时补充。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>当下最需要解决的\u003c/b>：体重从最低点回升，需要核对测量时间与这一段记录的变化\u003c/li>\u003cli>\u003cb>现有记录里的线索\u003c/b>：病历提及「血糖 / 糖尿病」相关表述 6 次；病历提及「肿瘤 / 重大病史」相关表述 8 次\u003c/li>\u003c/ul>"},{"t":"饮食建议","html":"\u003cp>体重管理期间，饮食的作用是把摄入稳定在可长期维持的水平，不需要一次性改掉所有习惯。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>每餐怎么安排\u003c/b>：按一掌蛋白、一拳主食、一捧蔬菜起步，先固定三餐时段\u003c/li>\u003cli>\u003cb>用药后胃口变小\u003c/b>：把一顿拆成两三次，清淡少量，恶心明显时先放一放\u003c/li>\u003cli>\u003cb>记录做到什么程度\u003c/b>：体重每周记 1 次、腰围每月记 1 次即可，外食与甜饮打勾\u003c/li>\u003c/ul>\u003cp class=\"note\">营养师会按复查记录给出个性化方案。\u003c/p>"},{"t":"运动建议","html":"\u003cp>运动先从维持原有走动开始，等身体适应后再考虑增加次数，避免在用药早期同时改动太多安排。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>起步量\u003c/b>：在现状上每天多走 1000 步，久坐时起身走动\u003c/li>\u003cli>\u003cb>力量与有氧\u003c/b>：适应后抗阻每周 2 次、每次 10–15 分钟，有氧每周 3 次、每次 10–20 分钟\u003c/li>\u003cli>\u003cb>需要停下的时候\u003c/b>：胸痛、明显气促、头晕或关节剧痛时立即停止并联系医生\u003c/li>\u003c/ul>"},{"t":"用药建议","html":"\u003cdiv class=\"mbar\">\u003cspan>匹配度\u003c/span>\u003cb>不适用\u003c/b>\u003ci style=\"width:10%\">\u003c/i>\u003c/div>\u003cp>按目前的体重与体检记录，不需要借助减重药物；把日常饮食与运动安排稳定下来即可。\u003c/p>"}],"disc":"本页内容基于你填写的问卷与已关联的健康数据生成，为初步评估建议，不构成诊断和处方。"}},{"id":"C5","name":"唐以宁","dim":"体重记录超 90 天","gender":"男","age":35.7,"height":172,"weight":78.3,"bmi":26.5,"a":{"tier":"normal","tierLabel":"需要减重管理","cur":2,"hint":"当前 BMI 26.5，并伴有化验异常，建议饮食、运动与医生评估同步开展。","mods":[{"t":"整体建议","html":"\u003cp>最近一次实测 78.3kg（7月22日），BMI 26.5（超重），化验异常 15 项，检查异常 20 项，体重记录距今 112 天。这些记录来自已关联的体测、化验、检查与就诊资料，问卷未覆盖的部分由医生面诊时补充。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>当下最需要解决的\u003c/b>：就诊记录还在更新，体重却很久没有新的实测值\u003c/li>\u003cli>\u003cb>现有记录里的线索\u003c/b>：肝功异常 2 项；肾功 / 尿酸异常 1 项\u003c/li>\u003c/ul>"},{"t":"饮食建议","html":"\u003cp>已有化验指标异常，饮食调整的重点是让每餐结构稳定，而不是额外压低饭量。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>每餐怎么安排\u003c/b>：按一掌蛋白、一拳主食、一捧蔬菜起步，先固定三餐时段\u003c/li>\u003cli>\u003cb>用药后胃口变小\u003c/b>：把一顿拆成两三次，清淡少量，恶心明显时先放一放\u003c/li>\u003cli>\u003cb>记录做到什么程度\u003c/b>：体重每周记 1 次、腰围每月记 1 次即可，外食与甜饮打勾\u003c/li>\u003c/ul>\u003cp class=\"note\">营养师会按复查记录给出个性化方案。\u003c/p>"},{"t":"运动建议","html":"\u003cp>运动先从维持原有走动开始，等身体适应后再考虑增加次数，避免在用药早期同时改动太多安排。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>起步量\u003c/b>：在现状上每天多走 1000 步，久坐时起身走动\u003c/li>\u003cli>\u003cb>力量与有氧\u003c/b>：适应后抗阻每周 2 次、每次 10–15 分钟，有氧每周 3 次、每次 10–20 分钟\u003c/li>\u003cli>\u003cb>需要停下的时候\u003c/b>：胸痛、明显气促、头晕或关节剧痛时立即停止并联系医生\u003c/li>\u003c/ul>"},{"t":"用药建议","html":"\u003cdiv class=\"mbar\">\u003cspan>匹配度\u003c/span>\u003cb>较高\u003c/b>\u003ci style=\"width:78%\">\u003c/i>\u003c/div>\u003cp>结合你的体重与体检记录，建议在调整饮食和运动的同时配合药物：它通过延缓胃排空、降低食欲减少摄入，让控制饮食的过程少一些饥饿感。\u003c/p>\u003cp>根据你当前的体重情况，参考按临床数据，用药后的体重预计变化情况如下：\u003c/p>\u003ctable class=\"tb\">\u003cthead>\u003ctr>\u003cth>周期\u003c/th>\u003cth>平均减重\u003c/th>\u003cth>你的参考值\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1 个月\u003c/td>\u003ctd>3%–4%\u003c/td>\u003ctd>−5~6 斤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 个月\u003c/td>\u003ctd>8%–10%\u003c/td>\u003ctd>−13~16 斤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6 个月\u003c/td>\u003ctd>12%–15%\u003c/td>\u003ctd>−19~23 斤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12 个月\u003c/td>\u003ctd>18%–21%\u003c/td>\u003ctd>−28~33 斤\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>用药前你可能想确认的：\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>用药能多减多少\u003c/b>：单靠生活方式一年通常减掉体重的 3%–5%，配合药物后的幅度见上表\u003c/li>\u003cli>\u003cb>用药安全吗\u003c/b>：已在国内外获批用于体重管理，医生评估通过后从小剂量开始，用药期间按随访计划监测\u003c/li>\u003cli>\u003cb>是否会依赖\u003c/b>：这类药物不是成瘾性药物，停药后由生活习惯接管维持\u003c/li>\u003cli>\u003cb>是否需要长期使用\u003c/b>：达到目标后按复查结果逐步减量，多数人不需要一直使用\u003c/li>\u003cli>\u003cb>胃肠道反应\u003c/b>：多在前 4 周逐渐适应，不适明显时随时联系医生调整\u003c/li>\u003c/ul>\u003cp>用药期间需留意已有异常指标的波动，复查时把前后两次记录放在一起看。\u003c/p>\u003cp class=\"note\">上述区间来自临床研究，个体差异较大，以实际随访数据为准。\u003c/p>"}],"disc":"本页内容基于你填写的问卷与已关联的健康数据生成，为初步评估建议，不构成诊断和处方。"}},{"id":"C6","name":"孟昭然","dim":"合并长期用药","gender":"女","age":38.4,"height":159,"weight":77,"bmi":30.5,"a":{"tier":"offline","tierLabel":"需要减重与慢病结合管理","cur":3,"hint":"已关联的用药记录里存在需要医生统一评估的长期用药，建议先在内科面诊，把现有用药与体重管理放到同一份方案里。","mods":[{"t":"整体建议","html":"\u003cp>最近一次实测 77.0kg（11月6日），BMI 30.5（肥胖），化验异常 2 项，检查异常 1 项，不良反应 1 条，长期用药记录 7 类。这些记录来自已关联的体测、化验、检查与就诊资料，问卷未覆盖的部分由医生面诊时补充。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>当下最需要解决的\u003c/b>：长期用药与减重安排需要医生统一评估，不能分开看\u003c/li>\u003cli>\u003cb>现有记录里的线索\u003c/b>：病历提及「肿瘤 / 重大病史」相关表述 10 次；血糖 / 糖化异常 1 项\u003c/li>\u003c/ul>"},{"t":"饮食建议","html":"\u003cp>已有化验指标异常，饮食调整的重点是让每餐结构稳定，而不是额外压低饭量。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>每餐怎么安排\u003c/b>：按一掌蛋白、一拳主食、一捧蔬菜起步，先固定三餐时段\u003c/li>\u003cli>\u003cb>用药后胃口变小\u003c/b>：把一顿拆成两三次，清淡少量，恶心明显时先放一放\u003c/li>\u003cli>\u003cb>记录做到什么程度\u003c/b>：体重每周记 1 次、腰围每月记 1 次即可，外食与甜饮打勾\u003c/li>\u003c/ul>\u003cp class=\"note\">营养师会按复查记录给出个性化方案。\u003c/p>"},{"t":"运动建议","html":"\u003cp>运动先从维持原有走动开始，等身体适应后再考虑增加次数，避免在用药早期同时改动太多安排。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>起步量\u003c/b>：在现状上每天多走 1000 步，久坐时起身走动\u003c/li>\u003cli>\u003cb>力量与有氧\u003c/b>：适应后抗阻每周 2 次、每次 10–15 分钟，有氧每周 3 次、每次 10–20 分钟\u003c/li>\u003cli>\u003cb>需要停下的时候\u003c/b>：胸痛、明显气促、头晕或关节剧痛时立即停止并联系医生\u003c/li>\u003c/ul>"},{"t":"用药建议","html":"\u003cdiv class=\"mbar\">\u003cspan>匹配度\u003c/span>\u003cb>需医生面诊评估\u003c/b>\u003ci style=\"width:65%\">\u003c/i>\u003c/div>\u003cp>你目前的长期用药与减重药物之间可能相互影响，需要由医生把两类用药放在一起评估后再决定是否使用。\u003c/p>\u003cp class=\"note\">匹配度基于已关联的用药记录估算，个体差异较大。\u003c/p>"},{"t":"就诊建议","html":"\u003cp>现有长期用药需要医生统一评估，建议带上用药清单到内科面诊。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>面诊看什么\u003c/b>：由医生结合原始记录判断体重管理方式与用药适用性\u003c/li>\u003cli>\u003cb>复查怎么安排\u003c/b>：按医生给出的复查计划回看指标变化\u003c/li>\u003c/ul>"}],"disc":"本页内容基于你填写的问卷与已关联的健康数据生成，为初步评估建议，不构成诊断和处方。"}},{"id":"C7","name":"钟亦晴","dim":"无体测数据","gender":"女","age":59.3,"height":null,"weight":null,"bmi":null,"a":{"tier":"insufficient","tierLabel":"需补充体测记录后再评估","cur":0,"hint":"本案例为「过敏控制」订阅，记录里没有体测数据。补齐身高体重与相关检查后，再判断是否需要体重管理。","mods":[{"t":"整体建议","html":"\u003cp>现有记录里可用于评估的信息较少。这些记录来自已关联的体测、化验、检查与就诊资料，问卷未覆盖的部分由医生面诊时补充。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>当下最需要解决的\u003c/b>：缺少身高体重等体测记录，暂时无法给出体重管理结论\u003c/li>\u003cli>\u003cb>现有记录里的线索\u003c/b>：10 类数据待补充；用药安全筛查未完成确认\u003c/li>\u003c/ul>"},{"t":"饮食建议","html":"\u003cp>体重管理期间，饮食的作用是把摄入稳定在可长期维持的水平，不需要一次性改掉所有习惯。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>每餐怎么安排\u003c/b>：按一掌蛋白、一拳主食、一捧蔬菜起步，先固定三餐时段\u003c/li>\u003cli>\u003cb>用药后胃口变小\u003c/b>：把一顿拆成两三次，清淡少量，恶心明显时先放一放\u003c/li>\u003cli>\u003cb>记录做到什么程度\u003c/b>：体重每周记 1 次、腰围每月记 1 次即可，外食与甜饮打勾\u003c/li>\u003c/ul>\u003cp class=\"note\">营养师会按复查记录给出个性化方案。\u003c/p>"},{"t":"运动建议","html":"\u003cp>运动先从维持原有走动开始，等身体适应后再考虑增加次数，避免在用药早期同时改动太多安排。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>起步量\u003c/b>：在现状上每天多走 1000 步，久坐时起身走动\u003c/li>\u003cli>\u003cb>力量与有氧\u003c/b>：适应后抗阻每周 2 次、每次 10–15 分钟，有氧每周 3 次、每次 10–20 分钟\u003c/li>\u003cli>\u003cb>需要停下的时候\u003c/b>：胸痛、明显气促、头晕或关节剧痛时立即停止并联系医生\u003c/li>\u003c/ul>"},{"t":"用药建议","html":"\u003cp>现有记录里缺少体测数据，用药适用性无法判断。补齐身高体重与相关检查后，由医生结合完整记录评估。\u003c/p>"},{"t":"就诊建议","html":"\u003cp>先补齐身高体重与基础检查，再由医生结合完整记录判断。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>面诊看什么\u003c/b>：由医生结合原始记录判断体重管理方式与用药适用性\u003c/li>\u003cli>\u003cb>复查怎么安排\u003c/b>：按医生给出的复查计划回看指标变化\u003c/li>\u003c/ul>"}],"disc":"本页内容基于你填写的问卷与已关联的健康数据生成，为初步评估建议，不构成诊断和处方。"}},{"id":"C8","name":"宋清欢","dim":"资料较少","gender":"女","age":23.1,"height":163.6,"weight":86.3,"bmi":32.2,"a":{"tier":"normal","tierLabel":"需要减重管理","cur":2,"hint":"当前 BMI 32.2，并伴有检查异常，建议饮食、运动与医生评估同步开展。","mods":[{"t":"整体建议","html":"\u003cp>最近一次实测 86.3kg（11月8日），BMI 32.2（肥胖），检查异常 1 项。这些记录来自已关联的体测、化验、检查与就诊资料，问卷未覆盖的部分由医生面诊时补充。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>当下最需要解决的\u003c/b>：就诊与化验记录较少，先补齐基础信息再判断下一步\u003c/li>\u003cli>\u003cb>现有记录里的线索\u003c/b>：检查异常 1 项；BMI 32.2，达到肥胖范围\u003c/li>\u003c/ul>"},{"t":"饮食建议","html":"\u003cp>体重管理期间，饮食的作用是把摄入稳定在可长期维持的水平，不需要一次性改掉所有习惯。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>每餐怎么安排\u003c/b>：按一掌蛋白、一拳主食、一捧蔬菜起步，先固定三餐时段\u003c/li>\u003cli>\u003cb>用药后胃口变小\u003c/b>：把一顿拆成两三次，清淡少量，恶心明显时先放一放\u003c/li>\u003cli>\u003cb>记录做到什么程度\u003c/b>：体重每周记 1 次、腰围每月记 1 次即可，外食与甜饮打勾\u003c/li>\u003c/ul>\u003cp class=\"note\">营养师会按复查记录给出个性化方案。\u003c/p>"},{"t":"运动建议","html":"\u003cp>运动先从维持原有走动开始，等身体适应后再考虑增加次数，避免在用药早期同时改动太多安排。\u003c/p>\u003cul class=\"ul\">\u003cli>\u003cb>起步量\u003c/b>：在现状上每天多走 1000 步，久坐时起身走动\u003c/li>\u003cli>\u003cb>力量与有氧\u003c/b>：适应后抗阻每周 2 次、每次 10–15 分钟，有氧每周 3 次、每次 10–20 分钟\u003c/li>\u003cli>\u003cb>需要停下的时候\u003c/b>：胸痛、明显气促、头晕或关节剧痛时立即停止并联系医生\u003c/li>\u003c/ul>"},{"t":"用药建议","html":"\u003cdiv c var esc=function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});};
var q=new URLSearchParams(location.search),cur=q.get("id")||CASES[0].id,sel=document.getElementById("who");
CASES.forEach(function(c){var o=document.createElement("option");o.value=c.id;o.textContent=c.id+" "+c.name+" · "+c.dim;sel.appendChild(o);});
sel.value=cur;sel.addEventListener("change",function(){var u=new URL(location.href);u.searchParams.set("id",this.value);location.href=u.toString();});
function BODY(c){
  var a=c.a,h="";
  var bars="",ax="";
  for(var i=0;i<3;i++){bars+='<i class="'+(i===a.cur-1?"on":"")+'"></i>';ax+='<span class="'+(i===a.cur-1?"on":"")+'">'+["无需减重","需要减重管理","需要减重与慢病结合管理"][i]+'</span>';}
  h+='<section class="hero"><div class="hero__hd"><b>'+esc(c.name)+'</b><span>'+esc(c.gender)+" · "+esc(c.age)+" 岁 · "+(c.height?esc(c.height)+"cm / ":"")+(c.weight!==null?esc(c.weight)+"kg":"无体测")+" · BMI "+(c.bmi!==null?esc(c.bmi):"—")+'</span></div>';
  h+='<div class="grade"><div class="grade__h"><span>减重建议</span><b>'+esc(a.tierLabel)+'</b></div><div class="grade__bar">'+bars+'</div><div class="grade__ax">'+ax+'</div></div><span class="hint">'+esc(a.hint)+'</span></section>';
  a.mods.forEach(function(m,i){h+='<section class="card"><h3><i>'+("0"+(i+1)).slice(-2)+'</i>'+esc(m.t)+'</h3><div class="card__b">'+m.html+'</div></section>';});
  h+='<div class="disc">'+esc(a.disc)+'</div>';
  return h;
}
function render(){var c=CASES.filter(function(x){return x.id===cur;})[0]||CASES[0];document.getElementById("view").innerHTML=BODY(c);document.title=c.name+" · 减重评估报告";}
